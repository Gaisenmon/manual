<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>凱旋門 マニュアル</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<style>
  /* ===== モノトーンのデザイントークン ===== */
  :root {
    --bg: #F3F3F1;        /* 画面の地 */
    --card: #FFFFFF;
    --soft: #F0F0EE;      /* 入力欄・補足の面 */
    --ink: #111111;       /* 文字・主ボタン */
    --ink-2: #3A3A3A;
    --muted: #8A8A8A;
    --line: #E3E3E0;
    --ember: #111111;     /* 旧アクセント（互換用）→ 黒 */
    --on-ember: #FFFFFF;
    --danger: #C62828;
    --head: #0E0E0E;
  }
  body.dark-mode {
    --bg: #0B0B0B; --card: #161616; --soft: #1F1F1F;
    --ink: #EDEDED; --ink-2: #C8C8C8; --muted: #8C8C8C; --line: #2A2A2A;
    --ember: #EDEDED; --on-ember: #111111; --danger: #EF5350; --head: #000000;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Helvetica Neue", "Hiragino Sans", "Noto Sans JP", sans-serif; -webkit-font-smoothing: antialiased; transition: background 0.2s; }
  button { font-family: inherit; }
  .ico { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; vertical-align: -3px; }

  .app-container { max-width: 480px; margin: 0 auto; background: var(--bg); min-height: 100vh; position: relative; display: flex; flex-direction: column; overflow-x: hidden; }

  /* ヘッダー */
  header { background: var(--head); color: #fff; padding: 14px 20px; padding-top: calc(14px + env(safe-area-inset-top)); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 10; border-bottom: 1px solid #222; }
  .brand { display: flex; align-items: baseline; gap: 10px; }
  .brand h1 { font-size: 17px; margin: 0; font-weight: 800; letter-spacing: 0.18em; }
  .brand small { font-size: 9.5px; font-weight: 700; letter-spacing: 0.32em; color: #8C8C8C; }
  .header-actions { display: flex; gap: 14px; align-items: center; }
  .sync { font-size: 10px; letter-spacing: 0.12em; color: #8C8C8C; display: flex; align-items: center; gap: 6px; }
  #sync-dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: #555; }
  .btn-reload { background: transparent; border: 1px solid #444; border-radius: 20px; padding: 5px 12px; color: #fff; font-size: 11px; font-weight: 700; letter-spacing: 0.05em; cursor: pointer; display: flex; align-items: center; gap: 5px; transition: 0.2s; }
  .btn-reload:active { transform: scale(0.95); background: #222; }

  main { flex: 1; padding: 22px 16px 90px; overflow-y: auto; }
  .sec-title { font-size: 20px; font-weight: 800; margin: 0 0 16px; letter-spacing: 0.04em; color: var(--ink); }
  .sub-title { font-weight: 800; font-size: 11px; letter-spacing: 0.16em; color: var(--muted); margin: 26px 0 10px; display: flex; align-items: center; gap: 8px; text-transform: uppercase; }
  .sub-title::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .empty-box { padding: 24px; text-align: center; color: var(--muted); font-size: 12px; background: var(--card); border: 1px dashed var(--line); border-radius: 10px; }

  /* 下部ナビ */
  .bottom-nav { position: fixed; bottom: 0; width: 100%; max-width: 480px; background: var(--card); border-top: 1px solid var(--line); display: flex; justify-content: space-around; padding: 10px 0 calc(10px + env(safe-area-inset-bottom)); z-index: 100; transition: 0.2s; }
  .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--muted); font-size: 10px; font-weight: 700; letter-spacing: 0.06em; cursor: pointer; flex: 1; position: relative; }
  .nav-item.active { color: var(--ink); }
  .nav-item svg { stroke: currentColor; width: 22px; height: 22px; stroke-width: 1.7; fill: none; transition: 0.2s; }
  .nav-item.active::before { content: ""; position: absolute; top: -10px; width: 22px; height: 2px; background: var(--ink); border-radius: 2px; }

  /* カテゴリツリー */
  .tree-cat { background: var(--card); border: 1px solid var(--line); border-radius: 12px; margin-bottom: 10px; overflow: hidden; }
  .tree-cat-head { padding: 16px 18px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; font-weight: 800; font-size: 15px; letter-spacing: 0.04em; }
  .cat-no { font-size: 11px; color: var(--muted); font-weight: 700; letter-spacing: 0.1em; margin-right: 10px; font-variant-numeric: tabular-nums; }
  .tree-cat-head svg, .tree-sub-head svg { width: 16px; height: 16px; stroke: var(--muted); stroke-width: 1.8; fill: none; transition: transform 0.2s; }
  .tree-cat.open .tree-cat-head svg { transform: rotate(180deg); }
  .tree-cat-body { display: none; border-top: 1px solid var(--line); }
  .tree-cat.open .tree-cat-body { display: block; }
  .tree-sub { border-bottom: 1px solid var(--line); }
  .tree-sub:last-child { border-bottom: none; }
  .tree-sub-head { padding: 13px 18px 13px 40px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; font-weight: 700; font-size: 14px; color: var(--ink); }
  .tree-sub.open .tree-sub-head svg { transform: rotate(180deg); }
  .tree-sub-body { display: none; padding: 0 14px 12px 28px; }
  .tree-sub.open .tree-sub-body { display: block; }
  .count { font-size: 11px; color: var(--muted); font-weight: 600; margin-left: 4px; }

  .manual-item { display: flex; align-items: center; gap: 12px; padding: 13px 14px; margin-bottom: 8px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; cursor: pointer; transition: border-color 0.15s; }
  .manual-item:active { border-color: var(--ink); }
  .manual-item-icon { flex-shrink: 0; color: var(--muted); display: flex; }
  .manual-item-title { font-size: 13.5px; font-weight: 700; color: var(--ink); line-height: 1.45; flex: 1; }
  .manual-item-sub { display: block; font-size: 11px; color: var(--muted); font-weight: 500; margin-top: 2px; letter-spacing: 0.02em; }
  .manual-item-arrow { color: var(--muted); display: flex; }

  /* NEW / 更新 */
  .badge-new { display: inline-block; background: var(--ink); color: var(--bg); font-size: 9px; font-weight: 800; padding: 2px 6px; border-radius: 3px; margin-left: 8px; vertical-align: 2px; letter-spacing: 0.12em; }
  .badge-new.upd { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
  .dot-new { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--ink); margin-left: 8px; vertical-align: 2px; }

  .search-box { display: flex; align-items: center; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 11px 14px; margin-bottom: 18px; transition: 0.2s; }
  .search-box:focus-within { border-color: var(--ink); }
  .search-box svg { stroke: var(--muted); width: 18px; height: 18px; stroke-width: 1.8; flex-shrink: 0; margin-right: 10px; fill: none; }
  .search-box input { border: none; background: transparent; font-size: 14px; width: 100%; outline: none; color: var(--ink); }
  .search-count { font-size: 11px; font-weight: 700; letter-spacing: 0.1em; color: var(--muted); margin-bottom: 12px; }

  .fab { position: fixed; right: 20px; bottom: calc(84px + env(safe-area-inset-bottom)); width: 54px; height: 54px; background: var(--ink); color: var(--bg); border-radius: 50%; display: none; align-items: center; justify-content: center; box-shadow: 0 6px 18px rgba(0,0,0,0.25); cursor: pointer; z-index: 90; transition: transform 0.2s; }
  .fab.show { display: flex; }
  .fab:active { transform: scale(0.94); }
  .fab svg { width: 24px; height: 24px; stroke: currentColor; stroke-width: 2; fill: none; }

  /* 閲覧・編集のシート */
  .viewer, .editor { position: fixed; inset: 0; background: var(--bg); z-index: 200; display: flex; flex-direction: column; transform: translateY(100%); transition: transform 0.25s ease-out; }
  .viewer.open, .editor.open { transform: translateY(0); }
  .v-header { background: var(--card); padding: 12px 14px; padding-top: calc(12px + env(safe-area-inset-top)); border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; }
  .v-close { display: flex; align-items: center; justify-content: center; width: 34px; height: 34px; cursor: pointer; color: var(--ink); }
  .v-close svg { stroke: currentColor; width: 22px; height: 22px; stroke-width: 1.8; fill: none; }
  .v-actions { display: flex; gap: 8px; }
  .icon-btn { cursor: pointer; color: var(--ink); display: flex; align-items: center; justify-content: center; width: 34px; height: 34px; border-radius: 50%; transition: 0.2s; }
  .icon-btn svg { width: 19px; height: 19px; stroke: currentColor; stroke-width: 1.8; fill: none; transition: 0.2s; }
  .icon-btn.active svg { fill: currentColor; }
  .icon-btn.danger { color: var(--danger); }
  .admin-only { display: none !important; }
  body.is-admin .admin-only { display: flex !important; }
  .editor-title { font-weight: 800; font-size: 14px; letter-spacing: 0.08em; }

  .v-content { flex: 1; overflow-y: auto; padding-bottom: calc(40px + env(safe-area-inset-bottom)); background: var(--bg); }
  .v-title-area { padding: 24px 18px 20px; background: var(--card); border-bottom: 1px solid var(--line); margin-bottom: 12px; }
  .v-path { font-size: 11px; font-weight: 700; color: var(--muted); letter-spacing: 0.1em; margin-bottom: 8px; }
  .v-title { margin: 0; font-size: 21px; font-weight: 800; color: var(--ink); line-height: 1.4; letter-spacing: 0.02em; }
  .v-updated { font-size: 11px; color: var(--muted); margin-top: 10px; letter-spacing: 0.04em; }

  /* ステップ（閲覧） */
  .step-card { background: var(--card); margin: 0 12px 12px; padding: 18px 16px; border: 1px solid var(--line); border-radius: 14px; }
  .step-no { display: flex; align-items: baseline; gap: 6px; margin-bottom: 12px; color: var(--ink); }
  .step-no span { font-size: 10px; font-weight: 800; letter-spacing: 0.24em; color: var(--muted); }
  .step-no b { font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: 0.02em; }
  .step-text { font-size: 15px; font-weight: 600; line-height: 1.8; white-space: pre-wrap; color: var(--ink); }
  .step-part { margin-top: 14px; }
  .ojt-tip { margin-top: 14px; padding: 12px 14px; background: var(--soft); border-left: 2px solid var(--ink); border-radius: 0 8px 8px 0; font-size: 13px; font-weight: 600; color: var(--ink-2); white-space: pre-wrap; line-height: 1.6; }
  .ojt-tip .tip-head { display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 800; letter-spacing: 0.1em; color: var(--ink); margin-bottom: 4px; }

  .check-item { display: flex; align-items: flex-start; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .check-item:last-child { border-bottom: none; }
  .check-item input[type="checkbox"] { width: 18px; height: 18px; margin-top: 2px; accent-color: var(--ink); cursor: pointer; flex-shrink: 0; }
  .check-item label { font-size: 14.5px; font-weight: 600; line-height: 1.5; cursor: pointer; transition: 0.2s; color: var(--ink); }
  .check-item input[type="checkbox"]:checked + label { text-decoration: line-through; color: var(--muted); }

  details.manual-accordion { background: var(--soft); border-radius: 8px; overflow: hidden; }
  details.manual-accordion summary { padding: 13px 14px; font-weight: 700; font-size: 13.5px; cursor: pointer; list-style: none; display: flex; justify-content: space-between; align-items: center; outline: none; }
  details.manual-accordion summary::-webkit-details-marker { display: none; }
  details.manual-accordion summary::after { content: "+"; font-size: 18px; font-weight: 400; color: var(--muted); line-height: 1; }
  details.manual-accordion[open] summary::after { content: "−"; }
  .accordion-content { padding: 0 14px 14px; font-size: 14px; line-height: 1.7; color: var(--ink-2); white-space: pre-wrap; }

  /* 画像 + 印（SVGを重ねる） */
  .ann-box { text-align: center; background: var(--soft); border-radius: 10px; margin-bottom: 12px; overflow: hidden; }
  .ann-wrap { position: relative; display: inline-block; line-height: 0; max-width: 100%; vertical-align: top; }
  .ann-wrap img { display: block; max-width: 100%; max-height: 320px; width: auto; height: auto; }
  .ann-wrap img.media-loading { min-width: 200px; min-height: 140px; background: var(--line); }
  .ann-svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
  #viewer-content .ann-wrap { cursor: zoom-in; }
  .zoom-caption { display: flex; align-items: center; justify-content: center; gap: 5px; font-size: 10.5px; letter-spacing: 0.08em; color: var(--muted); margin: -4px 0 10px; }
  .zoom-caption .ico { width: 12px; height: 12px; vertical-align: 0; }
  .video-box { width: 100%; max-height: 320px; border-radius: 10px; background: #000; display: block; }
  .yt-wrap { position: relative; width: 100%; aspect-ratio: 16 / 9; border-radius: 10px; overflow: hidden; background: #000; }
  .yt-wrap iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }

  /* フィードバック */
  .fb-card { background: var(--card); margin: 24px 12px 12px; padding: 22px 16px; border: 1px solid var(--line); border-radius: 14px; }
  .fb-q { font-weight: 800; font-size: 13px; letter-spacing: 0.06em; margin-bottom: 14px; text-align: center; }
  .fb-votes { display: flex; gap: 10px; margin-bottom: 14px; }
  .fb-btn { flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 11px; border: 1px solid var(--line); border-radius: 30px; background: var(--card); color: var(--ink); font-weight: 700; font-size: 14px; cursor: pointer; transition: 0.15s; font-variant-numeric: tabular-nums; }
  .fb-btn .ico { width: 18px; height: 18px; }
  .fb-btn:active { transform: scale(0.97); }
  .fb-btn.on { background: var(--ink); border-color: var(--ink); color: var(--bg); }
  .fb-send { width: 100%; }
  .fb-note { font-size: 10.5px; color: var(--muted); text-align: center; margin-top: 10px; letter-spacing: 0.04em; }
  .fb-list { margin-top: 18px; border-top: 1px solid var(--line); padding-top: 14px; }
  .fb-list-title { font-size: 10.5px; font-weight: 800; letter-spacing: 0.14em; color: var(--muted); margin-bottom: 6px; }
  .fb-item { padding: 11px 0; border-bottom: 1px solid var(--line); font-size: 13px; line-height: 1.55; }
  .fb-item:last-child { border-bottom: none; }
  .fb-meta { font-size: 11px; color: var(--muted); margin-top: 4px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .fb-meta .ico { width: 13px; height: 13px; vertical-align: -2px; }
  .fb-del { color: var(--danger); font-weight: 700; cursor: pointer; }
  .fb-text { white-space: pre-wrap; display: flex; gap: 6px; align-items: flex-start; }
  .fb-text .ico { width: 14px; height: 14px; margin-top: 3px; color: var(--muted); }
  .fb-link { color: var(--ink); font-weight: 700; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--line); }

  /* フォーム */
  .form-group { padding: 18px 16px 6px; background: var(--card); border-bottom: 1px solid var(--line); margin-bottom: 12px; }
  .form-label { font-size: 10.5px; font-weight: 800; letter-spacing: 0.12em; color: var(--muted); margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
  .form-label .ico { width: 13px; height: 13px; }
  .form-input, .form-select, .form-textarea, .form-file { width: 100%; padding: 12px; border: 1px solid var(--line); border-radius: 8px; font-size: 14px; background: var(--soft); color: var(--ink); font-family: inherit; margin-bottom: 12px; outline: none; transition: border-color 0.15s; }
  .form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--ink); }
  .form-file { padding: 10px; font-size: 12px; background: var(--card); cursor: pointer; border-style: dashed; }
  .form-textarea { min-height: 80px; resize: vertical; line-height: 1.6; }
  .editor-section-title { padding: 10px 16px 12px; font-weight: 800; font-size: 10.5px; letter-spacing: 0.16em; color: var(--muted); }

  /* ステップ（編集） */
  .edit-step-card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px 14px 14px; margin: 0 12px 12px; position: relative; }
  .step-tools { position: absolute; top: 12px; right: 12px; display: flex; gap: 6px; align-items: center; }
  .step-tool-btn { width: 30px; height: 30px; padding: 0; border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .step-tool-btn .ico { width: 15px; height: 15px; }
  .step-tool-btn:disabled { opacity: 0.25; cursor: default; }
  .step-tool-btn.danger { color: var(--danger); }
  .edit-step-card .ann-wrap img { max-height: 220px; }
  .img-actions { display: flex; gap: 8px; margin-bottom: 14px; }
  .btn-sub { flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 10px 6px; border: 1px solid var(--ink); color: var(--ink); background: var(--card); border-radius: 8px; font-weight: 700; font-size: 12.5px; cursor: pointer; }
  .btn-sub.quiet { border-color: var(--line); color: var(--muted); }
  .opt-sec { border-top: 1px solid var(--line); padding-top: 12px; margin-top: 2px; }
  .opt-sec-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .opt-sec-head .form-label { margin: 0; }
  .opt-remove { color: var(--muted); font-size: 11px; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 3px; }
  .opt-remove .ico { width: 12px; height: 12px; }
  .opt-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
  .opt-chip { display: inline-flex; align-items: center; gap: 4px; padding: 7px 12px; border: 1px solid var(--line); border-radius: 20px; font-size: 11.5px; font-weight: 700; color: var(--ink-2); background: var(--card); cursor: pointer; }
  .opt-chip .ico { width: 13px; height: 13px; }
  .opt-chip:active { border-color: var(--ink); }
  .media-hint { font-size: 11px; color: var(--muted); margin: -6px 0 10px; line-height: 1.5; }
  .check-edit-row { display: flex; gap: 8px; margin-bottom: 8px; }
  .check-edit-row .form-input { margin: 0; }
  .check-del { padding: 0; width: 38px; flex-shrink: 0; border: 1px solid var(--line); background: var(--card); color: var(--muted); border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; }

  .btn-add-step { display: flex; align-items: center; justify-content: center; gap: 6px; width: calc(100% - 24px); margin: 0 12px 28px; padding: 15px 6px; background: transparent; border: 1px dashed var(--muted); color: var(--ink); font-weight: 700; font-size: 13px; letter-spacing: 0.04em; border-radius: 14px; cursor: pointer; transition: 0.2s; }
  .btn-add-step.small { width: 100%; margin: 4px 0 12px; padding: 9px; font-size: 12px; border-radius: 8px; }
  .btn-add-step:active { border-color: var(--ink); }
  .btn-save { background: var(--ink); color: var(--bg); border: none; font-weight: 800; font-size: 13.5px; letter-spacing: 0.06em; padding: 10px 18px; border-radius: 30px; cursor: pointer; transition: 0.2s; }
  .btn-save:disabled { opacity: 0.4; cursor: not-allowed; }

  /* 設定 */
  .settings-card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: flex; flex-direction: column; gap: 16px; margin-bottom: 12px; transition: 0.2s; }
  .settings-item { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .settings-label { font-size: 14.5px; font-weight: 700; color: var(--ink); transition: 0.2s; }
  .settings-cap { font-size: 10.5px; font-weight: 800; letter-spacing: 0.16em; color: var(--muted); margin-bottom: -4px; }
  .btn-toggle { padding: 8px 16px; font-size: 12.5px; font-weight: 700; border-radius: 20px; cursor: pointer; border: 1px solid var(--line); background: var(--card); color: var(--ink); transition: 0.2s; white-space: nowrap; }
  .btn-toggle.active { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .btn-group { display: flex; background: var(--soft); border-radius: 20px; padding: 3px; }
  .btn-group button { border: none; background: transparent; padding: 6px 14px; font-size: 12.5px; font-weight: 700; color: var(--muted); cursor: pointer; transition: 0.2s; border-radius: 20px; }
  .btn-group button.active { background: var(--ink); color: var(--bg); }

  /* 画像の拡大表示 */
  .lightbox { position: fixed; inset: 0; background: rgba(0,0,0,0.94); z-index: 300; display: none; overflow: auto; -webkit-overflow-scrolling: touch; }
  .lightbox.open { display: flex; align-items: center; justify-content: center; }
  .lightbox.zoomed { display: block; }
  .lightbox .ann-wrap img { max-width: 100vw; max-height: 100vh; max-height: 100dvh; cursor: zoom-in; }
  .lightbox.zoomed .ann-wrap img { max-width: none; max-height: none; cursor: zoom-out; }
  .lb-close { position: fixed; top: calc(12px + env(safe-area-inset-top)); right: 12px; width: 40px; height: 40px; border-radius: 50%; background: rgba(255,255,255,0.12); color: #fff; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 301; }
  .lb-close .ico { width: 20px; height: 20px; }
  .lb-hint { position: fixed; bottom: calc(16px + env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); color: rgba(255,255,255,0.6); font-size: 11px; font-weight: 600; letter-spacing: 0.06em; pointer-events: none; white-space: nowrap; }

  /* 印つけエディタ（常にダーク） */

    if (!m) return "";

    let s = "";
    if (m.t === "c") {
      s = `<ellipse cx="${num(m.x)}" cy="${num(m.y)}" rx="${num(m.rx)}" ry="${num(m.ry)}" fill="none" stroke="${o}" stroke-width="${num(16 * z)}" stroke-opacity="0.85"/>`
        + `<ellipse cx="${num(m.x)}" cy="${num(m.y)}" rx="${num(m.rx)}" ry="${num(m.ry)}" fill="none" stroke="${c}" stroke-width="${num(9 * z)}"/>`;
    } else if (m.t === "a") {
      const g = arrowGeom(m);
      const pts = `${num(m.x2)},${num(m.y2)} ${num(g.p1[0])},${num(g.p1[1])} ${num(g.p2[0])},${num(g.p2[1])}`;
      s = `<line x1="${num(m.x1)}" y1="${num(m.y1)}" x2="${num(g.bx)}" y2="${num(g.by)}" stroke="${o}" stroke-width="${num(18 * z)}" stroke-linecap="round" stroke-opacity="0.85"/>`
        + `<polygon points="${pts}" fill="${o}" stroke="${o}" stroke-width="${num(8 * z)}" stroke-linejoin="round" opacity="0.85"/>`
        + `<line x1="${num(m.x1)}" y1="${num(m.y1)}" x2="${num(g.bx)}" y2="${num(g.by)}" stroke="${c}" stroke-width="${num(10 * z)}" stroke-linecap="round"/>`
        + `<polygon points="${pts}" fill="${c}"/>`;
    } else if (m.t === "t") {
      s = `<text x="${num(m.x)}" y="${num(m.y)}" font-size="${num(TEXT_SIZE * z)}" font-weight="900" font-family="Hiragino Sans, Noto Sans JP, sans-serif" fill="${c}" stroke="${o}" stroke-width="${num(10 * z)}" stroke-linejoin="round" paint-order="stroke" text-anchor="middle" dominant-baseline="central">${escapeHTML(m.s)}</text>`;
    }
    if (i === selIdx) {
      const b = markBox(m);
      if (m.t !== "a") s += `<rect x="${num(b.x - 14)}" y="${num(b.y - 14)}" width="${num(b.w + 28)}" height="${num(b.h + 28)}" fill="none" stroke="#fff" stroke-width="3" stroke-dasharray="12 10"/>`;
      handlePoints(m).forEach(h => {
        s += `<circle cx="${num(h.x)}" cy="${num(h.y)}" r="20" fill="#fff" stroke="#111" stroke-width="4"/>`;
      });
    }
    return s;
  }).join("");
}
function imageHtml(im) {
  if (!hasImage(im)) return "";
  const img = im.mediaKey
    ? `<img class="media-loading" data-media-key="${escapeHTML(im.mediaKey)}" alt="">`
    : `<img src="${escapeHTML(im.url)}" alt="">`;
  const marks = (im.marks || []).length && im.aspect
    ? `<svg class="ann-svg" viewBox="0 0 ${ANN_W} ${num(annH(im.aspect))}" preserveAspectRatio="none">${marksInner(im.marks)}</svg>`
    : "";
  return `<div class="ann-box"><div class="ann-wrap">${img}${marks}</div></div>`;
}

// data-media-key を持つ画像をDBから読み込む（1回読んだらキャッシュ）
function loadMediaImages(root) {
  root.querySelectorAll('img[data-media-key]').forEach(img => {
    const key = img.dataset.mediaKey;
    const show = (d) => { img.src = d; img.classList.remove('media-loading'); };
    if (mediaCache[key]) { show(mediaCache[key]); return; }
    mediaRef.child(key).child('data').once('value').then(snap => {
      const d = snap.val();
      if (typeof d === "string" && d.startsWith("data:image/")) { mediaCache[key] = d; show(d); }
      else { img.classList.remove('media-loading'); img.alt = "画像が見つかりません"; }
    }).catch(() => { img.classList.remove('media-loading'); img.alt = "画像の読み込みに失敗しました"; });
  });
}

// 画像を縮小してJPEGのdataURLにする。大きすぎる場合は段階的に小さくする
function compressImage(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const src = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(src);
      const tries = [[1024, 0.7], [800, 0.6], [640, 0.5]];
      let out = "", w = 0, h = 0;
      for (const [maxDim, q] of tries) {
        const scale = Math.min(1, maxDim / Math.max(img.width, img.height));
        w = Math.round(img.width * scale); h = Math.round(img.height * scale);
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, w, h); // 透過PNGの背景を白に
        ctx.drawImage(img, 0, 0, w, h);
        out = canvas.toDataURL('image/jpeg', q);
        if (out.length <= MAX_IMAGE_CHARS) break;
      }
      if (out.length > MAX_IMAGE_CHARS) reject(new Error("画像を十分に小さくできませんでした。別の画像で試してください。"));
      else resolve({ data: out, aspect: h / w });
    };
    img.onerror = () => { URL.revokeObjectURL(src); reject(new Error("画像を読み込めませんでした（非対応の形式の可能性）。")); };
    img.src = src;
  });
}

window.handleImageUpload = async function(input, idx) {
  const file = input.files[0];
  if (!file) return;
  const step = editSteps[idx]; // 送信中に並び替えられても正しいステップに入るよう参照を保持
  if (file.type.startsWith("video/")) {
    alert("動画は直接アップロードできません。\n「＋ 動画」からYouTube（限定公開）のURLを貼ってください。");
    input.value = ""; return;
  }
  const saveBtn = document.getElementById("save-btn");
  isUploading = true;
  input.disabled = true;
  if (saveBtn) { saveBtn.disabled = true; saveBtn.innerText = "処理中…"; }
  const finish = (errMsg) => {
    isUploading = false;
    input.disabled = false;
    input.value = "";
    if (saveBtn) { saveBtn.disabled = false; saveBtn.innerText = "保存"; }
    if (errMsg) alert(errMsg);
  };
  try {
    const { data, aspect } = await withTimeout(compressImage(file), 15000, "画像の変換に時間がかかりすぎています。別の画像で試してください。");
    if (saveBtn) saveBtn.innerText = "送信中…";
    const key = mediaRef.push().key;
    await withTimeout(mediaRef.child(key).set({ data, createdAt: Date.now() }), 20000, "送信に時間がかかりすぎています。通信状態を確認してください。");
    mediaCache[key] = data;
    step.image = { mediaKey: key, aspect, marks: [] };
    finish(null);
    renderEditorSteps();
  } catch (e) {
    const denied = /permission/i.test((e && (e.code || e.message)) || "");
    finish(denied
      ? "データベースのルールで書き込みが拒否されました。\nRealtime Databaseのルールで stores/gaisenmon/media への書き込みを許可してください。"
      : (e.message || "アップロードに失敗しました。"));
  }
};

// 拡大画像をタップ → 2倍 ⇔ 画面に合わせる（タップした位置を中心に）
lbWrap.addEventListener("click", (e) => {

/* ============================== 印つけエディタ ============================== */
let ann = null; // { step, aspect, marks, orig, tool, color, sel, undo, drag }
const annEditorEl = document.getElementById("ann-editor");
const ANN_HINTS = {
  select: "印をタップで選択 → ドラッグで移動。白い丸をドラッグで大きさ・向きを変更",
  circle: "ドラッグで丸を描く（タップだけなら標準サイズ）",
  arrow: "矢印の根元から先端へドラッグ（タップだけならその場所を指す矢印）",

// 色ボタンを生成
(function buildColorButtons() {
  const row = document.getElementById("ann-colors");

function openAnnotator(idx) {
  const step = editSteps[idx];
  const im = step && step.image;
  if (!hasImage(im)) return;
  const src = im.mediaKey ? mediaCache[im.mediaKey] : im.url;
  if (!src) { alert("画像を読み込み中です。少し待ってからもう一度押してください。"); return; }
  const marks = JSON.parse(JSON.stringify(im.marks || []));
  ann = { step, aspect: im.aspect || null, marks, orig: JSON.stringify(marks), tool: "circle", color: ANN_COLORS[0], z: 1, sizing: false, sel: -1, undo: [], drag: null };

  const stage = document.getElementById("ann-stage");
  stage.innerHTML = `<div class="ann-wrap"><img id="ann-img" alt=""><svg class="ann-svg" id="ann-svg" preserveAspectRatio="none"></svg></div>`;
  const img = document.getElementById("ann-img");
  img.onload = () => {
    if (!ann.aspect && img.naturalWidth) ann.aspect = img.naturalHeight / img.naturalWidth;
    renderAnn();
  };
  img.src = src;

  const svg = document.getElementById("ann-svg");
  svg.addEventListener("pointerdown", onAnnDown);
  svg.addEventListener("pointermove", onAnnMove);
  svg.addEventListener("pointerup", onAnnUp);
  svg.addEventListener("pointercancel", onAnnUp);

  annEditorEl.classList.add("open");
  renderAnn();
}
function closeAnnotator(apply) {
  if (!ann) return;
  if (apply) {
    ann.step.image.marks = ann.marks.map(roundMark);
    if (ann.aspect) ann.step.image.aspect = Math.round(ann.aspect * 10000) / 10000;
    renderEditorSteps();
  } else if (JSON.stringify(ann.marks) !== ann.orig && !confirm("印の変更を破棄しますか？")) {
    return;
  }
  annEditorEl.classList.remove("open");
  document.getElementById("ann-stage").innerHTML = "";
  ann = null;
}
function roundMark(m) {
  const o = { t: m.t, c: safeColor(m.c) };
  if (zOf(m) !== 1) o.z = Math.round(zOf(m) * 10) / 10;
  if (m.t === "c") Object.assign(o, { x: num(m.x), y: num(m.y), rx: num(m.rx), ry: num(m.ry) });
  if (m.t === "a") Object.assign(o, { x1: num(m.x1), y1: num(m.y1), x2: num(m.x2), y2: num(m.y2) });
  if (m.t === "t") Object.assign(o, { x: num(m.x), y: num(m.y), s: String(m.s || "") });
  return o;
}

function renderAnnSvg() {
  const svg = document.getElementById("ann-svg");
  if (!svg || !ann) return;
  svg.setAttribute("viewBox", `0 0 ${ANN_W} ${num(annH(ann.aspect))}`);
  svg.innerHTML = marksInner(ann.marks, ann.sel);
}
function renderAnn() {
  if (!ann) return;
  renderAnnSvg();
  document.querySelectorAll('.ann-tool[data-tool]').forEach(b => b.classList.toggle('active', b.dataset.tool === ann.tool));
  document.querySelectorAll('.ann-color').forEach(b => b.classList.toggle('active', b.dataset.color === ann.color));
  const sel = ann.marks[ann.sel];
  document.getElementById('ann-del').disabled = !sel;
  document.getElementById('ann-undo').disabled = ann.undo.length === 0;
  document.getElementById('ann-edit-text').style.display = sel && sel.t === "t" ? "" : "none";
  document.getElementById('ann-hint').textContent = ANN_HINTS[ann.tool] || "";
  const z = sel ? zOf(sel) : ann.z;
  document.getElementById('ann-size').value = z;
  document.getElementById('ann-size-val').textContent = Math.round(z * 100) + "%";
}
// 太さ・文字サイズ（選択中の印があればその印、なければ次に描く印に効く）
function onAnnSize(v) {
  if (!ann) return;
  const z = Math.max(0.5, Math.min(2.5, Number(v) || 1));
  ann.z = z;
  document.getElementById('ann-size-val').textContent = Math.round(z * 100) + "%";
  const sel = ann.marks[ann.sel];
  if (sel) {
    if (!ann.sizing) { annPush(); ann.sizing = true; }
    sel.z = z;
    renderAnnSvg();
  }
}
function annSizeDone() { if (ann) { ann.sizing = false; renderAnn(); } }
function setAnnTool(t) { if (!ann) return; ann.tool = t; renderAnn(); }
function setAnnColor(c) {
  if (!ann) return;
  ann.color = c;
  const sel = ann.marks[ann.sel];
  if (sel && sel.c !== c) { annPush(); sel.c = c; }
  renderAnn();
}
function annPush() {
  ann.undo.push(JSON.stringify(ann.marks));
  if (ann.undo.length > 50) ann.undo.shift();
}
function annUndo() {
  if (!ann || !ann.undo.length) return;
  ann.marks = JSON.parse(ann.undo.pop());
  ann.sel = -1;
  renderAnn();
}
function annDelete() {
  if (!ann || !ann.marks[ann.sel]) return;
  annPush();
  ann.marks.splice(ann.sel, 1);
  ann.sel = -1;
  renderAnn();
}
function annEditText() {
  const m = ann && ann.marks[ann.sel];
  if (!m || m.t !== "t") return;
  const s = prompt("文字を入力（30文字まで）", m.s);
  if (s === null) return;
  if (!s.trim()) { annDelete(); return; }
  annPush(); m.s = s.trim().slice(0, 30); renderAnn();
}

function annPt(e) {
  const svg = document.getElementById("ann-svg");
  const r = svg.getBoundingClientRect();
  return { x: (e.clientX - r.left) / r.width * ANN_W, y: (e.clientY - r.top) / r.height * annH(ann.aspect) };
}
function distToSeg(p, m) {
  const dx = m.x2 - m.x1, dy = m.y2 - m.y1, l2 = dx * dx + dy * dy || 1;
  const t = Math.max(0, Math.min(1, ((p.x - m.x1) * dx + (p.y - m.y1) * dy) / l2));
  return Math.hypot(p.x - (m.x1 + t * dx), p.y - (m.y1 + t * dy));
}
function hitMark(m, p) {
  if (m.t === "c") { const a = (p.x - m.x) / (m.rx + 24), b = (p.y - m.y) / (m.ry + 24); return a * a + b * b <= 1; }
  if (m.t === "a") return distToSeg(p, m) <= 34;
  const b = markBox(m); return p.x >= b.x - 20 && p.x <= b.x + b.w + 20 && p.y >= b.y - 20 && p.y <= b.y + b.h + 20;
}
function hitHandle(m, p) {
  if (!m) return null;
  const h = handlePoints(m).find(h => Math.hypot(p.x - h.x, p.y - h.y) <= 50);
  return h ? h.k : null;
}
function moveMark(o, dx, dy) {
  if (o.t === "a") return { x1: o.x1 + dx, y1: o.y1 + dy, x2: o.x2 + dx, y2: o.y2 + dy };
  return { x: o.x + dx, y: o.y + dy };
}

function onAnnDown(e) {
  if (!ann || !ann.aspect) return;
  e.preventDefault();
  const p = annPt(e);
  // 選択中の印のつまみを掴んだら、どのツールでも大きさ・向きを変更
  const handle = hitHandle(ann.marks[ann.sel], p);
  if (handle) {
    try { e.currentTarget.setPointerCapture(e.pointerId); } catch (_) {}
    ann.drag = { mode: "handle", which: handle, pushed: false };
    return;
  }
  if (ann.tool === "text") {
    setTimeout(() => {
      const s = prompt("入れる文字（30文字まで）");
      if (s && s.trim()) {
        annPush();
        ann.marks.push({ t: "t", x: p.x, y: p.y, s: s.trim().slice(0, 30), c: ann.color, z: ann.z });
        ann.sel = ann.marks.length - 1;
        renderAnn();
      }
    }, 0);
    return;
  }
  try { e.currentTarget.setPointerCapture(e.pointerId); } catch (_) {}
  if (ann.tool === "select") {
    let hit = -1;
    for (let i = ann.marks.length - 1; i >= 0; i--) { if (hitMark(ann.marks[i], p)) { hit = i; break; } }
    ann.sel = hit;
    if (hit >= 0) {
      ann.drag = { mode: "move", sx: p.x, sy: p.y, orig: JSON.parse(JSON.stringify(ann.marks[hit])), pushed: false };
      ann.color = ann.marks[hit].c;
      ann.z = zOf(ann.marks[hit]);
    }
    renderAnn();
    return;
  }
  annPush();
  if (ann.tool === "circle") ann.marks.push({ t: "c", x: p.x, y: p.y, rx: 0, ry: 0, c: ann.color, z: ann.z });
  else ann.marks.push({ t: "a", x1: p.x, y1: p.y, x2: p.x, y2: p.y, c: ann.color, z: ann.z });
  ann.sel = ann.marks.length - 1;
  ann.drag = { mode: ann.tool, sx: p.x, sy: p.y };
  renderAnn();
}
function onAnnMove(e) {
  if (!ann || !ann.drag) return;
  e.preventDefault();
  const p = annPt(e), d = ann.drag, m = ann.marks[ann.sel];
  if (!m) return;
  if (d.mode === "circle") {
    m.x = (d.sx + p.x) / 2; m.y = (d.sy + p.y) / 2;
    m.rx = Math.abs(p.x - d.sx) / 2; m.ry = Math.abs(p.y - d.sy) / 2;
  } else if (d.mode === "arrow") {
    m.x2 = p.x; m.y2 = p.y;
  } else if (d.mode === "handle") {
    if (!d.pushed) { annPush(); d.pushed = true; }
    if (m.t === "c") { m.rx = Math.max(12, Math.abs(p.x - m.x)); m.ry = Math.max(12, Math.abs(p.y - m.y)); }
    else if (m.t === "a" && d.which === "start") { m.x1 = p.x; m.y1 = p.y; }
    else if (m.t === "a") { m.x2 = p.x; m.y2 = p.y; }
  } else if (d.mode === "move") {
    const dx = p.x - d.sx, dy = p.y - d.sy;
    if (!d.pushed && Math.hypot(dx, dy) > 4) { annPush(); d.pushed = true; }
    if (d.pushed) Object.assign(m, moveMark(d.orig, dx, dy));
  }
  renderAnnSvg();
}
function onAnnUp() {
  if (!ann || !ann.drag) return;
  const d = ann.drag, m = ann.marks[ann.sel];
  if (m && d.mode === "circle" && m.rx < 12 && m.ry < 12) { m.x = d.sx; m.y = d.sy; m.rx = 70; m.ry = 70; }
  if (m && d.mode === "arrow" && Math.hypot(m.x2 - m.x1, m.y2 - m.y1) < 24) {
    // タップだけ → その場所を左上から指す矢印
    m.x2 = d.sx; m.y2 = d.sy; m.x1 = d.sx - 150; m.y1 = d.sy - 150;
  }
  ann.drag = null;
  renderAnn();
}

/* ============================== データ同期 ============================== */
// 旧形式（配列 / キーとIDが一致しない）かどうか
function isLegacyData(data) {
  if (!data) return false;
  if (Array.isArray(data)) return true;
  return Object.entries(data).some(([k, m]) => m && typeof m === "object" && String(m.id) !== k);
}
// 旧形式 → { "m1": {...}, ... }（数字だけのキーだと配列扱いされるので "m" を付ける）
function convertLegacy(data) {
  const list = (Array.isArray(data) ? data : Object.values(data)).filter(m => m && typeof m === "object");
  const out = {};
  list.forEach((m, i) => {
    const id = typeof m.id === "number" ? "m" + m.id : (m.id ? safeId(m.id) : "m_legacy" + i);
    out[id] = { ...m, id, createdAt: m.createdAt ?? (typeof m.id === "number" ? m.id : i) };
  });
  return out;
}
// 旧「ブロック型」→「ステップ型」（表示時に変換。次に保存したときに新形式で書き込まれる）
function convertBlocks(blocks) {
  const out = [];
  let cur = null;
  const newStep = () => { cur = { text: "" }; out.push(cur); return cur; };
  const addOjt = (st, o) => { if (o && String(o).trim()) st.ojt = st.ojt ? st.ojt + "\n" + o : o; };
  (Array.isArray(blocks) ? blocks : []).filter(Boolean).forEach(b => {
    if (b.type === "text") {
      const st = newStep(); st.text = b.text || ""; addOjt(st, b.ojt);
    } else if (b.type === "media") {
      const url = b.url || "";
      const isVideo = !!youtubeId(url) || b.mediaType === "youtube" || (b.mediaType || "").startsWith("video");
      if (isVideo && url) { const st = (cur && !cur.video) ? cur : newStep(); st.video = url; addOjt(st, b.ojt); }
      else if (b.mediaKey || url) { const st = (cur && !cur.image) ? cur : newStep(); st.image = b.mediaKey ? { mediaKey: b.mediaKey } : { url }; addOjt(st, b.ojt); }
    } else if (b.type === "checklist") {
      const items = (b.items || []).filter(x => x && String(x).trim());
      if (!items.length) return;
      const st = (cur && !cur.checks) ? cur : newStep(); st.checks = items; addOjt(st, b.ojt);
    } else if (b.type === "accordion") {
      const st = (cur && !cur.note) ? cur : newStep(); st.note = { title: b.title || "", text: b.text || "" }; addOjt(st, b.ojt);
    }
  });
  return out;
}
function normalizeManuals(data) {
  if (!data || Array.isArray(data)) return [];
  return Object.entries(data)
    .filter(([k, m]) => m && typeof m === "object" && HIERARCHY[m.category])
    .map(([k, m]) => {
      const steps = m.format === 2
        ? (Array.isArray(m.steps) ? m.steps : Object.values(m.steps || {})).filter(Boolean)
        : convertBlocks(Array.isArray(m.steps) ? m.steps : Object.values(m.steps || {}));
      return { ...m, id: k, steps };
    })
    .sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
}

let migrating = false;
manualsRef.on('value', (snapshot) => {
  const data = snapshot.val();
  if (isLegacyData(data)) {
    // 旧形式のデータを1回だけ新形式に移行（transactionなので同時に開いても安全）
    if (!migrating) {
      migrating = true;
      manualsRef.transaction(cur => isLegacyData(cur) ? convertLegacy(cur) : undefined)
        .catch(e => console.error("migration failed", e))
        .finally(() => { migrating = false; });
    }
    return;
  }
  manuals = normalizeManuals(data);
  refreshCurrentView();
});

function manualReload() {
  manualsRef.once('value').then((snapshot) => {
    const data = snapshot.val();
    if (!isLegacyData(data)) manuals = normalizeManuals(data);
    refreshCurrentView();
    toast("最新データに更新しました");
  }).catch(e => alert("更新に失敗しました: " + e.message));
}

function generateTreeHtml(sourceManuals) {
  let html = "";
  Object.keys(HIERARCHY).forEach(key => {
    const cat = HIERARCHY[key];
    const catManuals = sourceManuals.filter(m => m.category === key);
    if (catManuals.length === 0) return;
    const catDot = catManuals.some(badgeOf) ? `<span class="dot-new"></span>` : "";
    html += `<div class="tree-cat" data-key="cat:${key}" onclick="toggleTree(this, event)"><div class="tree-cat-head"><span><span class="cat-no">${cat.no}</span>${cat.name}${catDot}</span><svg viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"></polyline></svg></div><div class="tree-cat-body">`;
    cat.subs.forEach(sub => {
      const subManuals = catManuals.filter(m => m.sub === sub);
      if (subManuals.length === 0) return;
      const subDot = subManuals.some(badgeOf) ? `<span class="dot-new"></span>` : "";
      html += `<div class="tree-sub" data-key="sub:${key}:${escapeHTML(sub)}" onclick="toggleTree(this, event)"><div class="tree-sub-head"><span>${escapeHTML(sub)}<span class="count">${subManuals.length}</span>${subDot}</span><svg viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"></polyline></svg></div><div class="tree-sub-body">`;
      subManuals.forEach(m => { html += manualItemHtml(m, null); });
      html += `</div></div>`;
    });
    html += `</div></div>`;
  });
  if (!html) html = `<div class="empty-box">マニュアルはまだありません。</div>`;
  return html;
}

function stepMatches(s, kw) {
  const has = v => v && String(v).toLowerCase().includes(kw);
  return has(s.text) || has(s.ojt) || (s.note && (has(s.note.title) || has(s.note.text))) || (s.checks || []).some(has)
    || ((s.image && s.image.marks) || []).some(mk => mk && mk.t === "t" && has(mk.s));
}
function handleSearch(keyword) {
  const container = document.getElementById("explore-content");
  if (!container) return;
  if (!keyword.trim()) {
    // 再描画しても開いていたカテゴリは開いたままにする
    const openKeys = new Set([...container.querySelectorAll('.tree-cat.open, .tree-sub.open')].map(el => el.dataset.key));
    container.innerHTML = generateTreeHtml(manuals);
    container.querySelectorAll('[data-key]').forEach(el => { if (openKeys.has(el.dataset.key)) el.classList.add('open'); });
    return;
  }
  const kw = keyword.toLowerCase();
  const hits = manuals.filter(m => (m.title && m.title.toLowerCase().includes(kw)) || (m.sub && m.sub.toLowerCase().includes(kw)) || m.steps.some(s => stepMatches(s, kw)));
  if (hits.length === 0) { container.innerHTML = `<div class="empty-box">見つかりませんでした。</div>`; return; }
  let html = `<div class="search-count">${hits.length} RESULTS ／ ${hits.length}件</div>`;
  hits.forEach(m => { html += manualItemHtml(m, "sub"); });
  container.innerHTML = html;
}

/* ============================== フィードバック（👍👎・コメント） ============================== */
function deviceId() {
  let d = localStorage.getItem('gm_device');
  if (!d) { d = 'd' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8); localStorage.setItem('gm_device', d); }
  return d;
}
let fbState = { id: null, votes: {}, comments: {} };
let fbListenRef = null;

function feedbackHtml() {
  return `<div class="fb-card" id="fb-card">
    <div class="fb-q" id="fb-q">このマニュアルはわかりやすかった？</div>
    <div class="fb-votes">
      <button class="fb-btn" id="fb-good" onclick="voteManual(1)" aria-label="わかりやすい">${icon("up")}<span id="fb-good-n">0</span></button>
      <button class="fb-btn" id="fb-bad" onclick="voteManual(-1)" aria-label="わかりにくい">${icon("down")}<span id="fb-bad-n">0</span></button>
    </div>
    <textarea id="fb-text" class="form-textarea" maxlength="300" style="min-height:64px;" placeholder="ひとこと（わかりにくい所・内容が古い所・こうしたら？など）"></textarea>
    <button class="btn-save fb-send" onclick="sendComment()">コメントを送る</button>
    <div class="fb-note">コメントは管理者だけが確認します</div>
    <div id="fb-admin"></div>
  </div>`;
}
function watchFeedback(id) {
  unwatchFeedback();
  fbState = { id, votes: {}, comments: {} };
  fbListenRef = feedbackRef.child(id);
  fbListenRef.on('value', snap => {
    const v = snap.val() || {};
    fbState = { id, votes: v.votes || {}, comments: v.comments || {} };
    renderFeedbackState();
  }, () => {
    const q = document.getElementById("fb-q");
    if (q) q.textContent = "評価機能を使うにはデータベースのルール設定が必要です";
  });
}
function unwatchFeedback() { if (fbListenRef) { fbListenRef.off(); fbListenRef = null; } }

function renderFeedbackState() {
  const votes = Object.values(fbState.votes);
  const my = fbState.votes[deviceId()];
  const g = document.getElementById("fb-good"), b = document.getElementById("fb-bad");
  if (!g || !b) return;
  document.getElementById("fb-good-n").textContent = votes.filter(v => v === 1).length;
  document.getElementById("fb-bad-n").textContent = votes.filter(v => v === -1).length;
  g.classList.toggle("on", my === 1);
  b.classList.toggle("on", my === -1);

  const adminEl = document.getElementById("fb-admin");
  if (!isAdmin) { adminEl.innerHTML = ""; return; }
  const list = Object.entries(fbState.comments).sort((x, y) => (y[1].createdAt || 0) - (x[1].createdAt || 0));
  adminEl.innerHTML = `<div class="fb-list"><div class="fb-list-title">COMMENTS ／ 届いたコメント ${list.length}件（管理者のみ表示）</div>`
    + (list.length ? list.map(([k, c]) => commentItemHtml(fbState.id, k, c)).join("") : `<div style="font-size:12px;color:var(--muted);">まだコメントはありません</div>`)
    + `</div>`;
}
function voteIcon(v) { return v === 1 ? icon("up") : v === -1 ? icon("down") : ""; }
function commentItemHtml(manualId, key, c, titleHtml = "") {
  return `<div class="fb-item">${titleHtml}<div class="fb-text">${voteIcon(c.vote)}<span>${escapeHTML(c.text)}</span></div>
    <div class="fb-meta"><span>${formatDate(c.createdAt)}</span><span class="fb-del" onclick="deleteComment('${safeId(manualId)}','${safeId(key)}')">削除</span></div></div>`;
}
function voteManual(v) {
  if (!fbState.id) return;
  const ref = feedbackRef.child(fbState.id).child('votes').child(deviceId());
  const my = fbState.votes[deviceId()];
  (my === v ? ref.remove() : ref.set(v)).catch(e => alert("送信できませんでした: " + e.message));
}
function sendComment() {
  if (!fbState.id) return;
  const textEl = document.getElementById("fb-text");
  const text = (textEl.value || "").trim();
  if (!text) { alert("コメントを入力してください"); return; }
  const data = { text: text.slice(0, 300), createdAt: Date.now(), vote: fbState.votes[deviceId()] || 0 };
  feedbackRef.child(fbState.id).child('comments').push(data)
    .then(() => { textEl.value = ""; toast("送信しました。ありがとう！"); })
    .catch(e => alert("送信できませんでした: " + e.message));
}
function deleteComment(manualId, key) {
  if (!confirm("このコメントを削除しますか？")) return;
  feedbackRef.child(manualId).child('comments').child(key).remove()
    .then(() => { if (activeTabName() === '設定' && isAdmin) loadFeedbackOverview(); })
    .catch(e => alert("削除できませんでした: " + e.message));
}
function loadFeedbackOverview() {
  feedbackRef.once('value').then(snap => {
    const el = document.getElementById("fb-overview");
    if (!el) return;
    const all = snap.val() || {};
    const rows = [], comments = [];
    Object.entries(all).forEach(([mid, f]) => {
      const m = manuals.find(x => x.id === mid);
      if (!m || !f) return;
      const vs = Object.values(f.votes || {});
      const g = vs.filter(v => v === 1).length, b = vs.filter(v => v === -1).length;
      if (g || b) rows.push({ m, g, b });
      Object.entries(f.comments || {}).forEach(([k, c]) => comments.push({ m, k, c }));
    });
    if (!rows.length && !comments.length) { el.textContent = "まだ評価・コメントはありません"; return; }
    rows.sort((x, y) => y.b - x.b || y.g - x.g);
    comments.sort((x, y) => (y.c.createdAt || 0) - (x.c.createdAt || 0));
    let html = "";
    if (rows.length) {
      html += `<div class="fb-list-title">RATINGS ／ 低評価が多い順</div>`
        + rows.map(r => `<div class="fb-item"><span class="fb-link" onclick="openManual('${safeId(r.m.id)}')">${escapeHTML(r.m.title)}</span><div class="fb-meta"><span>${icon("up")} ${r.g}　${icon("down")} ${r.b}</span></div></div>`).join("");
    }
    if (comments.length) {
      html += `<div class="fb-list-title" style="margin-top:18px;">COMMENTS ／ 最近のコメント</div>`
        + comments.slice(0, 30).map(x => commentItemHtml(x.m.id, x.k, x.c, `<div class="fb-link" style="font-size:11.5px;margin-bottom:2px;" onclick="openManual('${safeId(x.m.id)}')">${escapeHTML(x.m.title)}</div>`)).join("");
    }
    el.style.color = "var(--ink)";
    el.innerHTML = html;
  }).catch(() => {
    const el = document.getElementById("fb-overview");
    if (el) el.textContent = "読み込めませんでした（データベースのルール設定が必要です）";
  });
}

function addStep() {
  editSteps.push({ text: "" });
  renderEditorSteps();
  const c = editor.querySelector(".v-content");
  setTimeout(() => c.scrollTop = c.scrollHeight, 100);
}
function removeStep(idx) {
  const s = editSteps[idx];
  const hasContent = s && ((s.text || "").trim() || hasImage(s.image) || s.video || (s.checks || []).some(x => x && x.trim()) || s.note || (s.ojt || "").trim());
  if (hasContent && !confirm(`STEP ${idx + 1} を削除しますか？`)) return;
  editSteps.splice(idx, 1);
  if (!editSteps.length) editSteps.push({ text: "" });
  renderEditorSteps();
}
function moveStep(idx, dir) {
  const j = idx + dir;
  if (j < 0 || j >= editSteps.length) return;
  [editSteps[idx], editSteps[j]] = [editSteps[j], editSteps[idx]];
  renderEditorSteps();
}
function removeImage(idx) {
  if (!confirm("このステップの写真を外しますか？（付けた印も消えます）")) return;
  delete editSteps[idx].image;
  renderEditorSteps();
}
// オプション（動画・チェックリスト・補足・指導ポイント）の追加／削除
const OPT_DEFAULTS = { video: () => "", checks: () => [""], note: () => ({ title: "", text: "" }), ojt: () => "" };
function addOpt(idx, key) { editSteps[idx][key] = OPT_DEFAULTS[key](); renderEditorSteps(); }
function removeOpt(idx, key) { delete editSteps[idx][key]; renderEditorSteps(); }
function setVideo(idx, v) { editSteps[idx].video = (v || "").trim(); renderEditorSteps(); }
function updateCheck(idx, i, v) { editSteps[idx].checks[i] = v; }
function addCheck(idx) { editSteps[idx].checks.push(""); renderEditorSteps(); }
function removeCheck(idx, i) { editSteps[idx].checks.splice(i, 1); if (!editSteps[idx].checks.length) delete editSteps[idx].checks; renderEditorSteps(); }

function optSection(idx, key, label, body) {
  return `<div class="opt-sec"><div class="opt-sec-head"><span class="form-label">${label}</span><span class="opt-remove" onclick="removeOpt(${idx}, '${key}')">${icon("x")}外す</span></div>${body}</div>`;
}
function renderEditorSteps() {
  const container = document.getElementById("editor-steps-container");
  container.innerHTML = editSteps.map((s, idx) => {
    let h = `<div class="edit-step-card">
      <div class="step-tools">
        <button class="step-tool-btn" onclick="moveStep(${idx}, -1)" ${idx === 0 ? "disabled" : ""} aria-label="上へ移動">${icon("chevUp")}</button>
        <button class="step-tool-btn" onclick="moveStep(${idx}, 1)" ${idx === editSteps.length - 1 ? "disabled" : ""} aria-label="下へ移動">${icon("chevDown")}</button>
        <button class="step-tool-btn danger" onclick="removeStep(${idx})" aria-label="削除">${icon("trash")}</button>
      </div>
      <div class="step-no"><span>STEP</span><b>${String(idx + 1).padStart(2, "0")}</b></div>`;

    // 写真
    if (hasImage(s.image)) {
      const n = (s.image.marks || []).length;
      h += imageHtml(s.image)
        + `<div class="img-actions"><button class="btn-sub" onclick="openAnnotator(${idx})">${icon("pen")}印をつける${n ? `（${n}）` : ""}</button><button class="btn-sub quiet" onclick="removeImage(${idx})">${icon("x")}写真を外す</button></div>`;
    } else {
      h += `<label class="form-label">${icon("image")}PHOTO ／ 写真（任意）</label><input type="file" accept="image/*" class="form-file" onchange="handleImageUpload(this, ${idx})">`;
    }

    // 説明文
    h += `<label class="form-label">TEXT ／ 手順の説明</label><textarea class="form-textarea" placeholder="例：トングは右手、お皿は左手で持つ" onchange="editSteps[${idx}].text = this.value">${escapeHTML(s.text)}</textarea>`;

    // オプション
    if (s.video !== undefined) {
      h += optSection(idx, "video", `${icon("video")}VIDEO ／ 動画（YouTubeのURL）`,
        `<input type="text" class="form-input" placeholder="https://youtu.be/..." value="${escapeHTML(s.video)}" onchange="setVideo(${idx}, this.value)">
         <div class="media-hint">YouTubeに「限定公開」でアップしてURLを貼ってください。30秒〜1分くらいが見やすいです。</div>
         ${s.video ? `<div style="margin-bottom:12px;">${videoHtml(s.video)}</div>` : ""}`);
    }
    if (s.checks !== undefined) {
      h += optSection(idx, "checks", `${icon("list")}CHECK ／ チェックリスト`,
        s.checks.map((it, i) => `<div class="check-edit-row"><input type="text" class="form-input" placeholder="確認する項目" value="${escapeHTML(it)}" onchange="updateCheck(${idx}, ${i}, this.value)"><button class="check-del" onclick="removeCheck(${idx}, ${i})">${icon("x")}</button></div>`).join("")
        + `<button class="btn-add-step small" onclick="addCheck(${idx})">${icon("plus")}項目を追加</button>`);
    }
    if (s.note !== undefined) {
      h += optSection(idx, "note", `${icon("note")}NOTE ／ 補足（折りたたみ）`,
        `<input type="text" class="form-input" placeholder="見出し 例：※混んでいるときは" value="${escapeHTML(s.note.title)}" onchange="editSteps[${idx}].note.title = this.value">
         <textarea class="form-textarea" placeholder="詳しい内容" onchange="editSteps[${idx}].note.text = this.value">${escapeHTML(s.note.text)}</textarea>`);
    }
    if (s.ojt !== undefined) {
      h += optSection(idx, "ojt", `${icon("bulb")}TIP ／ 指導のポイント`,
        `<textarea class="form-textarea" style="min-height:56px;" placeholder="新人がつまずきやすいポイントなど" onchange="editSteps[${idx}].ojt = this.value">${escapeHTML(s.ojt)}</textarea>`);
    }
    const chips = [
      s.video === undefined ? `<button class="opt-chip" onclick="addOpt(${idx}, 'video')">${icon("plus")}動画</button>` : "",
      s.checks === undefined ? `<button class="opt-chip" onclick="addOpt(${idx}, 'checks')">${icon("plus")}チェックリスト</button>` : "",
      s.note === undefined ? `<button class="opt-chip" onclick="addOpt(${idx}, 'note')">${icon("plus")}補足</button>` : "",
      s.ojt === undefined ? `<button class="opt-chip" onclick="addOpt(${idx}, 'ojt')">${icon("plus")}指導のポイント</button>` : "",
    ].join("");
    if (chips) h += `<div class="opt-chips">${chips}</div>`;
    return h + `</div>`;
  }).join("");
  loadMediaImages(container);
}

// 保存用にステップを整える（空の項目は捨てる・undefinedを含めない）
function cleanStep(s) {
  const o = { text: (s.text || "").trim() };
  if (hasImage(s.image)) {
    const im = {};
    if (s.image.mediaKey) im.mediaKey = s.image.mediaKey;
    else im.url = s.image.url;
    if (s.image.aspect) im.aspect = s.image.aspect;
    const marks = (s.image.marks || []).filter(Boolean).map(roundMark);
    if (marks.length) im.marks = marks;
    o.image = im;
  }
  if ((s.video || "").trim()) o.video = s.video.trim();
  const checks = (s.checks || []).map(x => (x || "").trim()).filter(Boolean);
  if (checks.length) o.checks = checks;
  if (s.note && ((s.note.title || "").trim() || (s.note.text || "").trim())) o.note = { title: (s.note.title || "").trim(), text: s.note.text || "" };
  if ((s.ojt || "").trim()) o.ojt = s.ojt;
  const valid = o.text || o.image || o.video || o.checks || o.note;
  return valid ? o : null;
}

function saveManual() {
  if (isUploading) { alert("現在、画像を送信中です。完了するまでお待ちください。"); return; }
  if (document.activeElement) document.activeElement.blur(); // 入力中の内容を確実に反映
  const title = document.getElementById("edit-title").value.trim();
  const cat = document.getElementById("edit-cat").value;
  const sub = document.getElementById("edit-sub").value;
  if (!title) { alert("タイトルを入力してください"); return; }
  const steps = editSteps.map(cleanStep).filter(Boolean);
  if (steps.length === 0) { alert("内容のあるステップがありません"); return; }

  const now = Date.now();
  const onError = e => alert("保存に失敗しました: " + e.message);

  if (editingId) {
    const id = editingId;
    const old = manuals.find(x => x.id === id);
    const data = { id, category: cat, sub, title, steps, format: 2, createdAt: (old && old.createdAt) ?? now, updatedAt: now };
    manualsRef.child(id).set(data).then(() => {
      // 編集で使われなくなった画像をDBから削除
      const newKeys = new Set(collectMediaKeys(data));
      collectMediaKeys(old).filter(k => !newKeys.has(k)).forEach(k => mediaRef.child(k).remove());
      markSeen(data);
      closeEditor(true);
      openManual(id);
    }).catch(onError);
  } else {
    const id = manualsRef.push().key;
    const data = { id, category: cat, sub, title, steps, format: 2, createdAt: now, updatedAt: now };
    manualsRef.child(id).set(data).then(() => { markSeen(data); closeEditor(true); refreshCurrentView(); }).catch(onError);
  }
}

function deleteManual(id) {
  if (!confirm("本当にこのマニュアルを削除しますか？")) return;
  const target = manuals.find(m => m.id === id);
  manualsRef.child(id).remove().then(() => {
    collectMediaKeys(target).forEach(k => mediaRef.child(k).remove());
    feedbackRef.child(id).remove().catch(() => {});
    viewHistory = viewHistory.filter(v => v !== id); bookmarkedIds = bookmarkedIds.filter(v => v !== id);
    localStorage.setItem('gm_history', JSON.stringify(viewHistory)); localStorage.setItem('gm_bookmarks', JSON.stringify(bookmarkedIds));
    closeManual();
  }).catch(e => alert("削除に失敗しました: " + e.message));
}
</script>
