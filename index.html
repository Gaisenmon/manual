<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>凱旋門 マニュアルアプリ - 編集機能付き</title>
<style>
  :root {
    --charcoal: #241E19; --charcoal-2: #332A22;
    --ember: #C1531B; --ember-dark: #9C4013;
    --cream: #FBF6EE; --card: #FFFFFF;
    --ink: #2B2420; --muted: #8A7F72; --line: #E7DFD2;
    --green: #3F7D4C;
    --c-hall: #2F6B7A; --c-kitchen: #9C4013;
    --c-special: #684596; --c-rule: #3F7D4C;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; background: #EFEAE1; color: var(--ink); font-family: "Hiragino Sans", "Noto Sans JP", sans-serif; }
  
  .app-container { max-width: 480px; margin: 0 auto; background: var(--cream); min-height: 100vh; position: relative; display: flex; flex-direction: column; box-shadow: 0 0 20px rgba(0,0,0,0.1); overflow-x: hidden; }
  
  header { background: linear-gradient(135deg, var(--charcoal), var(--charcoal-2)); color: #F2E9DC; padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 10; border-bottom: 3px solid var(--ember); }
  header h1 { font-size: 16px; margin: 0; font-weight: 800; }
  
  main { flex: 1; padding: 16px 16px 80px; overflow-y: auto; }
  .sec-title { font-size: 14px; font-weight: 800; margin: 0 0 12px; border-bottom: 2px solid var(--ember); display: inline-block; padding-bottom: 4px; color: var(--charcoal); }

  .bottom-nav { position: fixed; bottom: 0; width: 100%; max-width: 480px; background: rgba(255, 255, 255, 0.98); backdrop-filter: blur(8px); border-top: 1px solid var(--line); display: flex; justify-content: space-around; padding: 10px 0 calc(10px + env(safe-area-inset-bottom)); z-index: 100; }
  .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--muted); font-size: 10px; font-weight: 700; cursor: pointer; flex: 1; }
  .nav-item.active { color: var(--charcoal); }
  .nav-item svg { stroke: var(--muted); width: 22px; height: 22px; stroke-width: 2; fill: none; transition: 0.2s; }
  .nav-item.active svg { stroke: var(--charcoal); fill: var(--charcoal); }

  /* ツリー型メニュー */
  .tree-cat { background: var(--card); border: 1px solid var(--line); border-radius: 8px; margin-bottom: 12px; overflow: hidden; }
  .tree-cat-head { padding: 16px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; font-weight: 800; font-size: 15px; background: #fff; }
  .tree-cat-head svg { width: 18px; height: 18px; stroke: var(--muted); transition: transform 0.2s; }
  .tree-cat.open .tree-cat-head svg { transform: rotate(180deg); }
  .tree-cat-body { display: none; background: var(--cream); border-top: 1px solid var(--line); }
  .tree-cat.open .tree-cat-body { display: block; }
  
  .tree-sub { border-bottom: 1px solid var(--line); }
  .tree-sub-head { padding: 14px 16px 14px 24px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; font-weight: 700; font-size: 14px; color: var(--charcoal); }
  .tree-sub-head svg { width: 16px; height: 16px; stroke: var(--muted); transition: transform 0.2s; }
  .tree-sub.open .tree-sub-head svg { transform: rotate(180deg); }
  .tree-sub-body { display: none; background: #fff; padding: 8px 16px 16px 24px; }
  .tree-sub.open .tree-sub-body { display: block; }
  
  .manual-item { display: flex; align-items: center; gap: 12px; padding: 12px; margin-bottom: 8px; background: #fff; border: 1px solid var(--line); border-radius: 6px; cursor: pointer; }
  .manual-item-icon { flex-shrink: 0; color: var(--muted); }
  .manual-item-title { font-size: 13.5px; font-weight: 800; color: var(--ink); line-height: 1.4; }

  /* フローティング追加ボタン (FAB) */
  .fab { position: fixed; right: 20px; bottom: 80px; width: 56px; height: 56px; background: var(--ember); color: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 12px rgba(193, 83, 27, 0.4); cursor: pointer; z-index: 90; transition: transform 0.2s; }
  .fab:active { transform: scale(0.95); }
  .fab svg { width: 28px; height: 28px; stroke: #fff; stroke-width: 2; }

  /* ビューワー (閲覧画面) */
  .viewer, .editor { position: fixed; inset: 0; background: #fff; z-index: 200; display: flex; flex-direction: column; transform: translateY(100%); transition: transform 0.25s ease-out; }
  .viewer.open, .editor.open { transform: translateY(0); }
  .v-header { background: #fff; padding: 14px 16px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; }
  .v-close { display: flex; align-items: center; justify-content: center; width: 32px; height: 32px; cursor: pointer; }
  .v-close svg { stroke: var(--charcoal); width: 24px; height: 24px; stroke-width: 2; }
  
  .v-actions { display: flex; gap: 12px; }
  .icon-btn { cursor: pointer; color: var(--muted); display: flex; align-items: center; justify-content: center; width: 32px; height: 32px; }
  .icon-btn svg { width: 20px; height: 20px; stroke: currentColor; stroke-width: 2; fill: none; }
  
  .v-content { flex: 1; overflow-y: auto; padding-bottom: 40px; background: var(--cream); }
  .v-title-area { padding: 20px 16px 16px; background: #fff; border-bottom: 1px solid var(--line); }
  .step-card { background: #fff; margin-bottom: 12px; padding: 16px; border-bottom: 1px solid var(--line); }
  .step-header { display: flex; align-items: baseline; gap: 8px; margin-bottom: 8px; }
  .step-num { color: var(--ember); font-weight: 900; font-size: 14px; }
  .step-desc { font-size: 14.5px; font-weight: 700; line-height: 1.6; }
  .ojt-tip { margin-top: 12px; padding: 12px; background: #FEF2F2; border-left: 3px solid var(--ember); border-radius: 2px; font-size: 13px; font-weight: 700; color: var(--ember-dark); }

  /* エディタ (作成・編集画面) */
  .form-group { padding: 16px; background: #fff; border-bottom: 1px solid var(--line); margin-bottom: 12px; }
  .form-label { font-size: 12px; font-weight: 800; color: var(--muted); margin-bottom: 8px; display: block; }
  .form-input, .form-select, .form-textarea { width: 100%; padding: 12px; border: 1px solid var(--line); border-radius: 6px; font-size: 14px; background: var(--cream); color: var(--ink); font-family: inherit; margin-bottom: 12px; }
  .form-textarea { min-height: 80px; resize: vertical; }
  
  .edit-step-card { background: #fff; border: 1px solid var(--line); border-radius: 6px; padding: 16px; margin: 0 16px 12px; position: relative; }
  .step-remove-btn { position: absolute; top: 12px; right: 12px; color: #DC2626; font-size: 12px; font-weight: 800; cursor: pointer; }
  
  .btn-add-step { margin: 0 16px 24px; display: block; width: calc(100% - 32px); padding: 12px; text-align: center; background: #fff; border: 2px dashed var(--muted); color: var(--muted); font-weight: 800; border-radius: 6px; cursor: pointer; }
  .btn-save { background: var(--ember); color: #fff; border: none; font-weight: 800; font-size: 14px; padding: 8px 16px; border-radius: 6px; cursor: pointer; }

</style>
</head>
<body>

<div class="app-container">
  <header><h1>凱旋門 マニュアル</h1></header>
  <main id="main-view"></main>
  
  <!-- FAB (新規追加ボタン) -->
  <div class="fab" onclick="openEditor()">
    <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
  </div>

  <div class="bottom-nav">
    <div class="nav-item" onclick="switchTab('home', this)">
      <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg><span>ホーム</span>
    </div>
    <div class="nav-item active" onclick="switchTab('explore', this)">
      <svg viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg><span>さがす</span>
    </div>
  </div>

  <!-- マニュアル閲覧ビュー -->
  <div class="viewer" id="manual-viewer">
    <div class="v-header">
      <div class="v-close" onclick="closeManual()"><svg viewBox="0 0 24 24" fill="none"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></div>
      <div class="v-actions">
        <div class="icon-btn" onclick="openEditor(currentManualId)"><svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg></div>
        <div class="icon-btn" onclick="deleteManual(currentManualId)"><svg viewBox="0 0 24 24" stroke="#DC2626"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg></div>
      </div>
    </div>
    <div class="v-content" id="viewer-content"></div>
  </div>

  <!-- マニュアル編集ビュー (Create/Update) -->
  <div class="editor" id="manual-editor">
    <div class="v-header">
      <div class="v-close" onclick="closeEditor()"><svg viewBox="0 0 24 24" fill="none"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></div>
      <div style="font-weight:800; font-size:15px;" id="editor-title">新規作成</div>
      <button class="btn-save" onclick="saveManual()">保存</button>
    </div>
    <div class="v-content" style="background:#EFEAE1;">
      <div class="form-group">
        <label class="form-label">マニュアルのタイトル</label>
        <input type="text" id="edit-title" class="form-input" placeholder="例: お肉の提供手順">
        
        <label class="form-label">大カテゴリ</label>
        <select id="edit-cat" class="form-select" onchange="updateSubCats()">
          <option value="hall">①ホール</option>
          <option value="kitchen">②キッチン</option>
          <option value="special">③特殊技能</option>
          <option value="rule">④ルール</option>
        </select>
        
        <label class="form-label">中カテゴリ (業務名)</label>
        <select id="edit-sub" class="form-select"></select>
      </div>

      <div style="padding:16px 16px 8px; font-weight:800; font-size:14px; color:var(--charcoal);">手順ステップ</div>
      <div id="editor-steps-container"></div>
      
      <button class="btn-add-step" onclick="addStepField()">+ ステップを追加</button>
    </div>
  </div>
</div>

<script>
// --- データ構造 ---
const HIERARCHY = {
  "hall": { label: "①ホール", color: "var(--c-hall)", subs: ["オンリー", "入口", "出し", "ドリンカー", "運び", "ラスト"] },
  "kitchen": { label: "②キッチン", color: "var(--c-kitchen)", subs: ["センター", "ファイヤー", "バック", "刺し場", "洗い場"] },
  "special": { label: "③特殊技能", color: "var(--c-special)", subs: ["集計", "肉カット", "予約管理"] },
  "rule": { label: "④ルール", color: "var(--c-rule)", subs: ["服務規律", "姿勢のルール"] }
};

// インメモリの簡易DB
let manuals = [
  { id: 1, category: "hall", sub: "出し", title: "お肉の提供手順（基本）",
    steps: [
      { text: "提供前に網の状態を確認し、焦げがあれば「網をお取替えしましょうか？」と声をかける。", ojt: "新人は網交換のタイミングが掴めません。「お肉を出す前」と教えてあげて。" },
      { text: "お肉の正面をお客様に向け、「特選カルビでございます」とハッキリ提供する。", ojt: "声が小さい新人が多いので、ワントーン上げることを意識させます。" }
    ]
  }
];

let currentManualId = null;
const mainView = document.getElementById("main-view");
const viewer = document.getElementById("manual-viewer");
const editor = document.getElementById("manual-editor");

// --- 表示処理 ---
function renderExplore() {
  let html = `<h2 class="sec-title">マニュアルを探す</h2>`;
  Object.keys(HIERARCHY).forEach(key => {
    const cat = HIERARCHY[key];
    html += `
      <div class="tree-cat" onclick="toggleTree(this, event)">
        <div class="tree-cat-head" style="border-left: 4px solid ${cat.color};">
          <span>${cat.label}</span>
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><polyline points="6 9 12 15 18 9"></polyline></svg>
        </div>
        <div class="tree-cat-body">
    `;
    cat.subs.forEach(sub => {
      const subManuals = manuals.filter(m => m.category === key && m.sub === sub);
      html += `
        <div class="tree-sub" onclick="toggleTree(this, event)">
          <div class="tree-sub-head">
            <span>${sub} <span style="font-size:11px;color:var(--muted);">(${subManuals.length})</span></span>
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><polyline points="6 9 12 15 18 9"></polyline></svg>
          </div>
          <div class="tree-sub-body">
      `;
      if (subManuals.length === 0) {
        html += `<div style="font-size:12px;color:var(--muted);">マニュアルはまだありません。</div>`;
      } else {
        subManuals.forEach(m => {
          html += `
            <div class="manual-item" onclick="openManual(${m.id})">
              <div class="manual-item-icon"><svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg></div>
              <div class="manual-item-title">${m.title}</div>
            </div>`;
        });
      }
      html += `</div></div>`;
    });
    html += `</div></div>`;
  });
  mainView.innerHTML = html;
}

function switchTab(tab, el) {
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  el.classList.add('active');
  if(tab === 'explore') renderExplore();
  else mainView.innerHTML = `<h2 class="sec-title">ホーム</h2><div style="padding:20px;text-align:center;color:var(--muted);font-size:13px;">新着一覧などが表示されます</div>`;
  window.scrollTo(0,0);
}

function toggleTree(el, ev) {
  if (ev.target.closest('.manual-item')) return;
  ev.stopPropagation();
  el.classList.toggle('open');
}

// --- 閲覧処理 ---
function openManual(id) {
  currentManualId = id;
  const m = manuals.find(x => x.id === id);
  const catLabel = HIERARCHY[m.category].label;
  
  let html = `
    <div class="v-title-area">
      <div style="font-size:11.5px;font-weight:800;color:var(--muted);margin-bottom:8px;">${catLabel} ＞ ${m.sub}</div>
      <h2 style="margin:0;font-size:18px;font-weight:800;color:var(--ink);">${m.title}</h2>
    </div>
  `;
  m.steps.forEach((s, idx) => {
    html += `
      <div class="step-card">
        <div class="step-header"><span class="step-num">${idx + 1}.</span><span class="step-desc">${s.text}</span></div>
        ${s.ojt ? `<div class="ojt-tip">💡 <b>指導のポイント</b><br>${s.ojt}</div>` : ''}
      </div>`;
  });
  document.getElementById("viewer-content").innerHTML = html;
  viewer.classList.add("open");
}
function closeManual() { viewer.classList.remove("open"); currentManualId = null; }

// --- 編集・作成処理 (CRUD) ---
let editSteps = [];

function updateSubCats() {
  const cat = document.getElementById("edit-cat").value;
  const subSelect = document.getElementById("edit-sub");
  subSelect.innerHTML = HIERARCHY[cat].subs.map(s => `<option value="${s}">${s}</option>`).join("");
}

function openEditor(id = null) {
  const isEdit = id !== null;
  document.getElementById("editor-title").innerText = isEdit ? "マニュアル編集" : "新規作成";
  
  if (isEdit) {
    const m = manuals.find(x => x.id === id);
    document.getElementById("edit-title").value = m.title;
    document.getElementById("edit-cat").value = m.category;
    updateSubCats();
    document.getElementById("edit-sub").value = m.sub;
    editSteps = JSON.parse(JSON.stringify(m.steps)); // Deep copy
  } else {
    document.getElementById("edit-title").value = "";
    document.getElementById("edit-cat").value = "hall";
    updateSubCats();
    editSteps = [{ text: "", ojt: "" }];
  }
  
  renderEditorSteps();
  editor.classList.add("open");
}
function closeEditor() { editor.classList.remove("open"); }

function renderEditorSteps() {
  const container = document.getElementById("editor-steps-container");
  container.innerHTML = editSteps.map((step, idx) => `
    <div class="edit-step-card">
      <div class="step-remove-btn" onclick="removeStep(${idx})">削除 ✕</div>
      <label class="form-label">ステップ ${idx + 1} の手順</label>
      <textarea class="form-textarea" placeholder="手順を記入" onchange="editSteps[${idx}].text = this.value">${step.text}</textarea>
      
      <label class="form-label">💡 指導のポイント (OJTメモ / 任意)</label>
      <textarea class="form-textarea" style="min-height:50px; background:#FEF2F2;" placeholder="新人がつまずきやすいポイントなど" onchange="editSteps[${idx}].ojt = this.value">${step.ojt || ""}</textarea>
    </div>
  `).join("");
}

function addStepField() {
  editSteps.push({ text: "", ojt: "" });
  renderEditorSteps();
}

function removeStep(idx) {
  editSteps.splice(idx, 1);
  renderEditorSteps();
}

function saveManual() {
  const title = document.getElementById("edit-title").value.trim();
  const cat = document.getElementById("edit-cat").value;
  const sub = document.getElementById("edit-sub").value;
  
  if (!title) { alert("タイトルを入力してください"); return; }
  
  // 空のステップを除外
  const validSteps = editSteps.filter(s => s.text.trim() !== "");
  if (validSteps.length === 0) { alert("最低1つの手順を入力してください"); return; }

  const isEdit = document.getElementById("editor-title").innerText === "マニュアル編集";
  
  if (isEdit) {
    const mIndex = manuals.findIndex(x => x.id === currentManualId);
    manuals[mIndex] = { id: currentManualId, category: cat, sub: sub, title: title, steps: validSteps };
    openManual(currentManualId); // 更新内容をビューワーに反映
  } else {
    const newId = manuals.length > 0 ? Math.max(...manuals.map(m => m.id)) + 1 : 1;
    manuals.push({ id: newId, category: cat, sub: sub, title: title, steps: validSteps });
  }
  
  closeEditor();
  renderExplore(); // 一覧を再描画
}

function deleteManual(id) {
  if (!confirm("本当にこのマニュアルを削除しますか？")) return;
  manuals = manuals.filter(m => m.id !== id);
  closeManual();
  renderExplore();
}

// 初期化
renderExplore();
</script>
</body>
</html>
