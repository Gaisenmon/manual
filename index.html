<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>凱旋門 マニュアルアプリ</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<style>
  :root {
    --charcoal: #241E19; --charcoal-2: #332A22;
    --ember: #C1531B; --ember-dark: #9C4013;
    --cream: #FBF6EE; --card: #FFFFFF;
    --ink: #2B2420; --muted: #8A7F72; --line: #E7DFD2;
    --green: #3F7D4C;
  }
  
  body.dark-mode {
    --cream: #121212; --card: #1E1E1E; --ink: #E0DCD5;
    --muted: #8A8A8A; --line: #333333; --charcoal: #000000; --charcoal-2: #111111;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; background: var(--cream); color: var(--ink); font-family: "Hiragino Sans", "Noto Sans JP", sans-serif; transition: 0.2s; }
  
  .app-container { max-width: 480px; margin: 0 auto; background: var(--cream); min-height: 100vh; position: relative; display: flex; flex-direction: column; box-shadow: 0 0 20px rgba(0,0,0,0.1); overflow-x: hidden; }
  header { background: linear-gradient(135deg, var(--charcoal), var(--charcoal-2)); color: #F2E9DC; padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 10; border-bottom: 3px solid var(--ember); }
  header h1 { font-size: 16px; margin: 0; font-weight: 800; letter-spacing: 0.05em; }
  
  .header-actions { display: flex; gap: 12px; align-items: center; }
  .btn-reload { background: #394C58; border: none; border-radius: 4px; padding: 5px 10px; color: #fff; font-size: 11px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 4px; transition: 0.2s; }
  .btn-reload:active { transform: scale(0.95); background: #2B3A44; }

  main { flex: 1; padding: 16px 16px 80px; overflow-y: auto; }
  .sec-title { font-size: 14px; font-weight: 800; margin: 0 0 12px; border-bottom: 2px solid var(--ember); display: inline-block; padding-bottom: 4px; color: var(--ink); }

  .bottom-nav { position: fixed; bottom: 0; width: 100%; max-width: 480px; background: var(--card); border-top: 1px solid var(--line); display: flex; justify-content: space-around; padding: 10px 0 calc(10px + env(safe-area-inset-bottom)); z-index: 100; transition: 0.2s; }
  .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--muted); font-size: 10px; font-weight: 700; cursor: pointer; flex: 1; }
  .nav-item.active { color: var(--ink); }
  .nav-item svg { stroke: var(--muted); width: 22px; height: 22px; stroke-width: 2; fill: none; transition: 0.2s; }
  .nav-item.active svg { stroke: var(--ink); fill: var(--ink); }
  body.dark-mode .nav-item.active svg { fill: transparent; }

  .tree-cat { background: var(--card); border: 1px solid var(--line); border-radius: 8px; margin-bottom: 12px; overflow: hidden; }
  .tree-cat-head { padding: 16px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; font-weight: 800; font-size: 15px; background: var(--card); }
  .tree-cat-head svg { width: 18px; height: 18px; stroke: var(--muted); transition: transform 0.2s; }
  .tree-cat.open .tree-cat-head svg { transform: rotate(180deg); }
  .tree-cat-body { display: none; background: var(--cream); border-top: 1px solid var(--line); }
  .tree-cat.open .tree-cat-body { display: block; }
  .tree-sub { border-bottom: 1px solid var(--line); }
  .tree-sub-head { padding: 14px 16px 14px 24px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; font-weight: 700; font-size: 14px; color: var(--ink); }
  .tree-sub-head svg { width: 16px; height: 16px; stroke: var(--muted); transition: transform 0.2s; }
  .tree-sub.open .tree-sub-head svg { transform: rotate(180deg); }
  .tree-sub-body { display: none; background: var(--card); padding: 8px 16px 16px 24px; }
  .tree-sub.open .tree-sub-body { display: block; }
  
  .manual-item { display: flex; align-items: center; gap: 12px; padding: 12px; margin-bottom: 8px; background: var(--card); border: 1px solid var(--line); border-radius: 6px; cursor: pointer; }
  .manual-item-icon { flex-shrink: 0; color: var(--muted); }
  .manual-item-title { font-size: 13.5px; font-weight: 800; color: var(--ink); line-height: 1.4; transition: 0.2s; }
  .manual-item-sub { font-size: 11px; color: var(--muted); font-weight: normal; margin-left: 6px; }

  .search-box { display: flex; align-items: center; background: var(--card); border: 2px solid var(--line); border-radius: 8px; padding: 8px 12px; margin-bottom: 16px; transition: 0.2s; }
  .search-box:focus-within { border-color: var(--ember); }
  .search-box svg { stroke: var(--muted); width: 18px; height: 18px; flex-shrink: 0; margin-right: 8px; }
  .search-box input { border: none; background: transparent; font-size: 14px; width: 100%; outline: none; color: var(--ink); }

  .fab { position: fixed; right: 20px; bottom: 80px; width: 56px; height: 56px; background: var(--ember); color: #fff; border-radius: 50%; display: none; align-items: center; justify-content: center; box-shadow: 0 4px 12px rgba(193, 83, 27, 0.4); cursor: pointer; z-index: 90; transition: transform 0.2s; }
  .fab.show { display: flex; }
  .fab:active { transform: scale(0.95); }
  .fab svg { width: 28px; height: 28px; stroke: #fff; stroke-width: 2; }

  .viewer, .editor { position: fixed; inset: 0; background: var(--card); z-index: 200; display: flex; flex-direction: column; transform: translateY(100%); transition: transform 0.25s ease-out; }
  .viewer.open, .editor.open { transform: translateY(0); }
  .v-header { background: var(--card); padding: 14px 16px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; }
  .v-close { display: flex; align-items: center; justify-content: center; width: 32px; height: 32px; cursor: pointer; }
  .v-close svg { stroke: var(--ink); width: 24px; height: 24px; stroke-width: 2; }
  
  .v-actions { display: flex; gap: 12px; }
  .icon-btn { cursor: pointer; color: var(--muted); display: flex; align-items: center; justify-content: center; width: 32px; height: 32px; transition: 0.2s; }
  .icon-btn svg { width: 20px; height: 20px; stroke: currentColor; stroke-width: 2; fill: none; transition: 0.2s; }
  .icon-btn.active svg { fill: var(--ember); stroke: var(--ember); color: var(--ember); }
  
  .admin-only { display: none !important; }
  body.is-admin .admin-only { display: flex !important; }

  .v-content { flex: 1; overflow-y: auto; padding-bottom: 40px; background: var(--cream); }
  .v-title-area { padding: 20px 16px 16px; background: var(--card); border-bottom: 1px solid var(--line); }
  .v-updated { font-size: 11px; color: var(--muted); margin-top: 6px; }
  
  .step-card { background: var(--card); margin-bottom: 12px; padding: 16px; border-bottom: 1px solid var(--line); }
  .step-header { display: flex; align-items: baseline; gap: 8px; margin-bottom: 8px; }
  .step-num { color: var(--ember); font-weight: 900; font-size: 14px; flex-shrink: 0; }
  .step-desc { font-size: 14.5px; font-weight: 700; line-height: 1.6; flex: 1; white-space: pre-wrap; transition: 0.2s; color: var(--ink); }
  .ojt-tip { margin-top: 12px; padding: 12px; background: rgba(193,83,27,0.1); border-left: 3px solid var(--ember); border-radius: 2px; font-size: 13px; font-weight: 700; color: var(--ember); white-space: pre-wrap; }
  
  .check-item { display: flex; align-items: flex-start; gap: 8px; margin-bottom: 10px; }
  .check-item input[type="checkbox"] { width: 18px; height: 18px; margin-top: 2px; accent-color: var(--ember); cursor: pointer; }
  .check-item label { font-size: 14.5px; font-weight: 700; line-height: 1.5; cursor: pointer; transition: 0.2s; color: var(--ink); }
  .check-item input[type="checkbox"]:checked + label { text-decoration: line-through; color: var(--muted); }

  .media-content { width: 100%; max-height: 240px; object-fit: contain; border-radius: 6px; background: var(--cream); margin-top: 8px; }
  .media-content.media-loading { min-height: 120px; background: var(--line); }
  .yt-wrap { position: relative; width: 100%; aspect-ratio: 16 / 9; margin-top: 8px; border-radius: 6px; overflow: hidden; background: #000; }
  .yt-wrap iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  #viewer-content img.media-content:not(.media-loading) { cursor: zoom-in; }
  .zoom-caption { font-size: 11px; color: var(--muted); text-align: center; margin-top: 4px; }
  .lightbox { position: fixed; inset: 0; background: rgba(0,0,0,0.92); z-index: 300; display: none; overflow: auto; -webkit-overflow-scrolling: touch; }
  .lightbox.open { display: flex; align-items: center; justify-content: center; }
  .lightbox.zoomed { display: block; }
  .lightbox img { max-width: 100%; max-height: 100%; object-fit: contain; cursor: zoom-in; }
  .lightbox.zoomed img { max-width: none; max-height: none; cursor: zoom-out; }
  .lb-close { position: fixed; top: calc(12px + env(safe-area-inset-top)); right: 12px; width: 40px; height: 40px; border-radius: 50%; background: rgba(255,255,255,0.15); color: #fff; font-size: 22px; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 301; }
  .lb-hint { position: fixed; bottom: calc(16px + env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); color: rgba(255,255,255,0.7); font-size: 12px; font-weight: 700; pointer-events: none; white-space: nowrap; }
  .media-hint { font-size: 11px; color: var(--muted); margin: -6px 0 10px; line-height: 1.5; }

  details.manual-accordion { background: var(--cream); border: 1px solid var(--line); border-radius: 6px; margin-bottom: 8px; overflow: hidden; }
  details.manual-accordion summary { padding: 14px 16px; font-weight: 800; font-size: 14px; cursor: pointer; list-style: none; display: flex; justify-content: space-between; align-items: center; outline: none; }
  details.manual-accordion summary::-webkit-details-marker { display: none; }
  details.manual-accordion summary::after { content: "▼"; font-size: 11px; color: var(--muted); transition: 0.2s; }
  details.manual-accordion[open] summary::after { transform: rotate(180deg); }
  .accordion-content { padding: 0 16px 16px; font-size: 14px; line-height: 1.6; color: var(--ink); border-top: 1px dashed var(--line); margin-top: 4px; padding-top: 12px; white-space: pre-wrap; }

  .form-group { padding: 16px; background: var(--card); border-bottom: 1px solid var(--line); margin-bottom: 12px; }
  .form-label { font-size: 12px; font-weight: 800; color: var(--muted); margin-bottom: 8px; display: block; }
  .form-input, .form-select, .form-textarea, .form-file { width: 100%; padding: 12px; border: 1px solid var(--line); border-radius: 6px; font-size: 14px; background: var(--cream); color: var(--ink); font-family: inherit; margin-bottom: 12px; }
  .form-file { padding: 8px; font-size: 12px; background: var(--card); cursor: pointer; }
  .form-textarea { min-height: 80px; resize: vertical; }
  
  .edit-step-card { background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 16px 16px 12px; margin: 0 16px 12px; position: relative; }
  .step-tools { position: absolute; top: 10px; right: 12px; display: flex; gap: 6px; align-items: center; }
  .step-tool-btn { width: 30px; height: 30px; padding: 0; border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 6px; font-size: 14px; font-weight: 800; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .step-tool-btn:disabled { opacity: 0.3; cursor: default; }
  .step-remove-btn { color: #DC2626; font-size: 12px; font-weight: 800; cursor: pointer; margin-left: 4px; }
  
  .add-blocks { display: flex; gap: 8px; margin: 0 16px 24px; overflow-x: auto; padding-bottom: 8px; }
  .btn-add-step { flex: 1; min-width: 100px; padding: 12px 6px; text-align: center; background: var(--card); border: 2px dashed var(--muted); color: var(--muted); font-weight: 800; font-size: 11.5px; border-radius: 6px; cursor: pointer; white-space: nowrap; transition: 0.2s; }
  .btn-add-step:active { border-color: var(--ember); color: var(--ember); }
  .btn-save { background: var(--ember); color: #fff; border: none; font-weight: 800; font-size: 14px; padding: 8px 16px; border-radius: 6px; cursor: pointer; transition: 0.2s; }
  .btn-save:disabled { background: var(--muted); cursor: not-allowed; }

  .settings-card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 16px 20px; display: flex; flex-direction: column; gap: 16px; margin-bottom: 12px; transition: 0.2s; }
  .settings-item { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .settings-label { font-size: 14.5px; font-weight: 800; color: var(--ink); transition: 0.2s; }
  .btn-toggle { padding: 8px 16px; font-size: 13px; font-weight: 800; border-radius: 20px; cursor: pointer; border: 1px solid var(--line); background: var(--card); color: var(--ink); transition: 0.2s; white-space: nowrap; }
  .btn-toggle.active { background: var(--ember); color: #fff; border-color: var(--ember); }
  
  .btn-group { display: flex; background: var(--cream); border-radius: 20px; border: 1px solid var(--line); overflow: hidden; }
  .btn-group button { border: none; background: transparent; padding: 8px 16px; font-size: 13px; font-weight: 800; color: var(--muted); cursor: pointer; transition: 0.2s; }
  .btn-group button.active { background: var(--ember); color: #fff; }

  body.font-large .manual-item-title { font-size: 15.5px; }
  body.font-large .step-desc { font-size: 16.5px; }
  body.font-large .settings-label { font-size: 16px; }
  body.font-large .accordion-content { font-size: 16px; }
</style>
</head>
<body>

<div class="app-container">
  <header>
    <h1>凱旋門 マニュアル</h1>
    <div class="header-actions">
      <div style="font-size: 11px; color: #C8BBA8; display:flex; align-items:center;">
        同期 <span id="sync-dot" style="display:inline-block;width:6px;height:6px;border-radius:50%;background:#DC2626;margin-left:4px;"></span>
      </div>
      <button class="btn-reload" onclick="manualReload()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" width="14" height="14" style="margin-right:2px;"><path d="M21 2v6h-6"></path><path d="M3 12a9 9 0 1 0 2.81-6.63L21 8"></path></svg>更新
      </button>
    </div>
  </header>
  
  <main id="main-view"></main>
  
  <div class="fab" id="main-fab" onclick="openEditor()">
    <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
  </div>

  <div class="bottom-nav">
    <div class="nav-item active" onclick="switchTab('home', this)">
      <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg><span>ホーム</span>
    </div>
    <div class="nav-item" onclick="switchTab('explore', this)">
      <svg viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg><span>さがす</span>
    </div>
    <div class="nav-item" onclick="switchTab('bookmark', this)">
      <svg viewBox="0 0 24 24"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path></svg><span>マイ学習</span>
    </div>
    <div class="nav-item" onclick="switchTab('settings', this)">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg><span>設定</span>
    </div>
  </div>

  <div class="viewer" id="manual-viewer">
    <div class="v-header">
      <div class="v-close" onclick="closeManual()"><svg viewBox="0 0 24 24" fill="none"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></div>
      <div class="v-actions">
        <div class="icon-btn" id="btn-bookmark" onclick="toggleBookmark()">
          <svg viewBox="0 0 24 24"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path></svg>
        </div>
        <div class="icon-btn admin-only" onclick="openEditor(currentManualId)"><svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg></div>
        <div class="icon-btn admin-only" onclick="deleteManual(currentManualId)"><svg viewBox="0 0 24 24" stroke="#DC2626"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg></div>
      </div>
    </div>
    <div class="v-content" id="viewer-content"></div>
  </div>

  <div class="editor" id="manual-editor">
    <div class="v-header">
      <div class="v-close" onclick="closeEditor()"><svg viewBox="0 0 24 24" fill="none"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></div>
      <div style="font-weight:800; font-size:15px;" id="editor-title">新規作成</div>
      <button class="btn-save" id="save-btn" onclick="saveManual()">保存</button>
    </div>
    <div class="v-content" style="background:var(--cream);">
      <div class="form-group">
        <label class="form-label">タイトル</label>
        <input type="text" id="edit-title" class="form-input" placeholder="例: お肉の提供手順">
        <label class="form-label">大カテゴリ</label>
        <select id="edit-cat" class="form-select" onchange="updateSubCats()"><option value="hall">①ホール</option><option value="kitchen">②キッチン</option><option value="special">③特殊技能</option><option value="rule">④ルール</option></select>
        <label class="form-label">中カテゴリ (業務名)</label>
        <select id="edit-sub" class="form-select"></select>
      </div>
      <div style="padding:16px 16px 8px; font-weight:800; font-size:14px; color:var(--ink);">マニュアルの構成</div>
      <div id="editor-steps-container"></div>
      <div class="add-blocks">
        <button class="btn-add-step" onclick="addStepField('text')">＋ テキスト</button>
        <button class="btn-add-step" onclick="addStepField('checklist')">＋ チェック</button>
        <button class="btn-add-step" onclick="addStepField('accordion')">＋ 折りたたみ</button>
        <button class="btn-add-step" onclick="addStepField('media')">＋ 画像/動画</button>
      </div>
    </div>
  </div>
</div>

<div class="lightbox" id="lightbox">
  <div class="lb-close" id="lb-close">✕</div>
  <img id="lb-img" alt="">
  <div class="lb-hint">画像をタップで2倍 ／ 背景タップで閉じる</div>
</div>

<script>
function escapeHTML(str) {
  if (!str) return "";
  return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
// onclick属性に埋め込むID用（英数字・_・- 以外を除去）
function safeId(id) { return String(id).replace(/[^\w-]/g, ""); }

let isUploading = false;

const firebaseConfig = {
  apiKey: "AIzaSyDzUmUoZsTpV8PlTU-qRyDiByOImpOc_Kk",
  authDomain: "akamo-staff-management.firebaseapp.com",
  databaseURL: "https://akamo-staff-management-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "akamo-staff-management",
  storageBucket: "akamo-staff-management.firebasestorage.app",
  messagingSenderId: "249759074777",
  appId: "1:249759074777:web:4b9b5332d22dae182bf1c8"
};

if (!firebase.apps.length) {
    firebase.initializeApp(firebaseConfig);
}
const db = firebase.database();
// マニュアルは manuals/{id} に1件ずつ保存する（同時編集で他の人のデータを上書きしないため）
const manualsRef = db.ref('stores/gaisenmon/manuals');
// 画像本体はマニュアルとは別の場所に保存する（一覧の同期が重くならないように）
const mediaRef = db.ref('stores/gaisenmon/media');

db.ref('.info/connected').on('value', function(snap) {
  const dot = document.getElementById('sync-dot');
  if (snap.val() === true) { dot.style.background = '#5EA36B'; } else { dot.style.background = '#DC2626'; }
});

let manuals = [];
let isAdmin = false;

function formatDate(ts) {
  const d = new Date(ts);
  if (isNaN(d)) return "";
  return `${d.getFullYear()}/${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
}

/* ============================== メディア（画像・動画） ============================== */
const MAX_IMAGE_CHARS = 400 * 1024; // 圧縮後の上限（base64で約400KB）
const mediaCache = {};

function withTimeout(promise, ms, msg) {
  return Promise.race([promise, new Promise((_, rej) => setTimeout(() => rej(new Error(msg)), ms))]);
}

function youtubeId(url) {
  const m = /(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:.*&)?v=|shorts\/|embed\/|live\/))([\w-]{11})/.exec(url || "");
  return m ? m[1] : null;
}

function detectMediaType(url) {
  if (youtubeId(url)) return "youtube";
  if (/\.(mp4|mov|webm)(\?|$)/i.test(url)) return "video/mp4";
  return "image/jpeg";
}

function collectMediaKeys(m) {
  return ((m && m.steps) || []).filter(s => s && s.type === "media" && s.mediaKey).map(s => s.mediaKey);
}

// ステップ1件分のメディア表示HTML
function mediaHtml(s) {
  if (s.mediaKey) {
    return `<img class="media-content media-loading" data-media-key="${escapeHTML(s.mediaKey)}" alt="">`;
  }
  if (!s.url) return "";
  const yt = youtubeId(s.url);
  if (yt) {
    return `<div class="yt-wrap"><iframe src="https://www.youtube-nocookie.com/embed/${yt}" allow="encrypted-media; picture-in-picture" allowfullscreen loading="lazy"></iframe></div>`;
  }
  if (s.mediaType && s.mediaType.startsWith("video")) {
    return `<video class="media-content" src="${escapeHTML(s.url)}" controls playsinline></video>`;
  }
  return `<img class="media-content" src="${escapeHTML(s.url)}">`;
}

// data-media-key を持つ画像をDBから読み込む（1回読んだらキャッシュ）
function loadMediaImages(root) {
  root.querySelectorAll('img[data-media-key]').forEach(img => {
    const key = img.dataset.mediaKey;
    const show = (d) => { img.src = d; img.classList.remove('media-loading'); };
    if (mediaCache[key]) { show(mediaCache[key]); return; }
    mediaRef.child(key).child('data').once('value').then(snap => {
      const d = snap.val();
      if (typeof d === "string" && d.startsWith("data:image/")) {
        mediaCache[key] = d; show(d);
      } else {
        img.classList.remove('media-loading'); img.alt = "画像が見つかりません";
      }
    }).catch(() => { img.classList.remove('media-loading'); img.alt = "画像の読み込みに失敗しました"; });
  });
}

// 画像を縮小してJPEGのdataURLにする。大きすぎる場合は段階的に小さくする
function compressImage(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const src = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(src);
      const tries = [[1024, 0.7], [800, 0.6], [640, 0.5]];
      let out = "";
      for (const [maxDim, q] of tries) {
        const scale = Math.min(1, maxDim / Math.max(img.width, img.height));
        const w = Math.round(img.width * scale), h = Math.round(img.height * scale);
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, w, h); // 透過PNGの背景を白に
        ctx.drawImage(img, 0, 0, w, h);
        out = canvas.toDataURL('image/jpeg', q);
        if (out.length <= MAX_IMAGE_CHARS) break;
      }
      if (out.length > MAX_IMAGE_CHARS) reject(new Error("画像を十分に小さくできませんでした。別の画像で試してください。"));
      else resolve(out);
    };
    img.onerror = () => { URL.revokeObjectURL(src); reject(new Error("画像を読み込めませんでした（非対応の形式の可能性）。")); };
    img.src = src;
  });
}

window.handleMediaUpload = async function(input, idx) {
  const file = input.files[0];
  if (!file) return;
  const step = editSteps[idx]; // 送信中に並び替えられても正しいブロックに入るよう参照を保持

  if (file.type.startsWith("video/")) {
    alert("動画は直接アップロードできません。\nYouTubeに「限定公開」でアップして、そのURLを下の欄に貼ってください。");
    input.value = ""; return;
  }

  const saveBtn = document.getElementById("save-btn");
  isUploading = true;
  input.disabled = true;
  if (saveBtn) { saveBtn.disabled = true; saveBtn.innerText = "⏳ 画像を処理中..."; }

  const finish = (errMsg) => {
    isUploading = false;
    input.disabled = false;
    input.value = "";
    if (saveBtn) { saveBtn.disabled = false; saveBtn.innerText = "保存"; }
    if (errMsg) alert(errMsg);
  };

  try {
    const dataUrl = await withTimeout(compressImage(file), 15000,
      "画像の変換に時間がかかりすぎています。別の画像で試してください。");
    if (saveBtn) saveBtn.innerText = "⏳ 送信中...";

    const key = mediaRef.push().key;
    await withTimeout(mediaRef.child(key).set({ data: dataUrl, createdAt: Date.now() }), 20000,
      "送信に時間がかかりすぎています。通信状態を確認してください。");

    mediaCache[key] = dataUrl;
    step.mediaKey = key;
    step.url = "";
    step.mediaType = "image/jpeg";
    finish(null);
    renderEditorSteps();
  } catch (e) {
    const denied = /permission/i.test((e && (e.code || e.message)) || "");
    finish(denied
      ? "データベースのルールで書き込みが拒否されました。\nRealtime Databaseのルールで stores/gaisenmon/media への書き込みを許可してください。"
      : (e.message || "アップロードに失敗しました。"));
  }
};

function isImageStep(s) {
  if (s.mediaKey) return true;
  return !!s.url && !youtubeId(s.url) && !(s.mediaType || "").startsWith("video");
}

function openLightbox(src) {
  lbImg.style.width = "";
  lightbox.classList.remove("zoomed");
  lbImg.src = src;
  lightbox.classList.add("open");
}
function closeLightbox() {
  lightbox.classList.remove("open", "zoomed");

  lbImg.removeAttribute("src");

// マニュアル内の画像をタップしたら拡大
document.getElementById("viewer-content").addEventListener("click", (e) => {
  const img = e.target.closest("img.media-content");
  if (img && img.src && !img.classList.contains("media-loading")) openLightbox(img.src);
});

// 拡大画像をタップ → 2倍表示 ⇔ 画面に合わせる（タップした位置を中心に拡大）
lbImg.addEventListener("click", (e) => {
  e.stopPropagation();
  if (lightbox.classList.contains("zoomed")) {
    lightbox.classList.remove("zoomed");
    lbImg.style.width = "";
    return;
  }
  const rect = lbImg.getBoundingClientRect();
  const rx = (e.clientX - rect.left) / rect.width;
  const ry = (e.clientY - rect.top) / rect.height;
  lbImg.style.width = (rect.width * 2) + "px";
  lightbox.classList.add("zoomed");
  requestAnimationFrame(() => {
    lightbox.scrollLeft = rx * lbImg.offsetWidth - lightbox.clientWidth / 2;
    lightbox.scrollTop = ry * lbImg.offsetHeight - lightbox.clientHeight / 2;
  });
});

lightbox.addEventListener("click", closeLightbox);
document.getElementById("lb-close").addEventListener("click", (e) => { e.stopPropagation(); closeLightbox(); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeLightbox(); });

/* ============================== データ同期 ============================== */
// 旧形式（配列 / キーとIDが一致しない）かどうか
function isLegacyData(data) {
  if (!data) return false;
  if (Array.isArray(data)) return true;
  return Object.entries(data).some(([k, m]) => m && typeof m === "object" && String(m.id) !== k);
}
// 旧形式 → { "m1": {...}, "m2": {...} } に変換（数字だけのキーだと配列扱いされるので "m" を付ける）
function convertLegacy(data) {
  const list = (Array.isArray(data) ? data : Object.values(data)).filter(m => m && typeof m === "object");
  const out = {};
  list.forEach((m, i) => {
    const id = typeof m.id === "number" ? "m" + m.id : (m.id ? safeId(m.id) : "m_legacy" + i);
    out[id] = { ...m, id, createdAt: m.createdAt ?? (typeof m.id === "number" ? m.id : i) };
  });
  return out;
}
function normalizeManuals(data) {
  if (!data || Array.isArray(data)) return [];
  return Object.entries(data)
    .filter(([k, m]) => m && typeof m === "object" && HIERARCHY[m.category])
    .map(([k, m]) => ({ ...m, id: k, steps: Array.isArray(m.steps) ? m.steps.filter(Boolean) : [] }))
    .sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
}

let migrating = false;
manualsRef.on('value', (snapshot) => {
  const data = snapshot.val();
  if (isLegacyData(data)) {
    // 旧形式のデータを1回だけ新形式に移行（transactionなので同時に開いても安全）
    if (!migrating) {
      migrating = true;
      manualsRef.transaction(cur => isLegacyData(cur) ? convertLegacy(cur) : undefined)
        .catch(e => console.error("migration failed", e))
        .finally(() => { migrating = false; });
    }
    return;
  }
  manuals = normalizeManuals(data);
  refreshCurrentView();
});

function manualReload() {
  manualsRef.once('value').then((snapshot) => {
    const data = snapshot.val();
    if (!isLegacyData(data)) manuals = normalizeManuals(data);
    refreshCurrentView();
    const t = document.createElement("div");
    t.style.cssText = "position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.8);color:#fff;padding:12px 24px;border-radius:30px;font-weight:bold;font-size:13px;z-index:9999;";
    t.innerText = "最新データに更新しました";
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 1500);
  }).catch(e => alert("更新に失敗しました: " + e.message));
}

function refreshCurrentView() {

  if (activeTab === 'さがす') {

    const input = document.getElementById("explore-search");

  else if (activeTab === '設定') renderSettings();

}

function generateTreeHtml(sourceManuals) {
  let html = "";
  Object.keys(HIERARCHY).forEach(key => {
    const cat = HIERARCHY[key];
    const catManuals = sourceManuals.filter(m => m.category === key);
    if(catManuals.length === 0) return;
    html += `<div class="tree-cat" data-key="cat:${key}" onclick="toggleTree(this, event)"><div class="tree-cat-head" style="border-left: 4px solid ${cat.color};"><span>${cat.label}</span><svg viewBox="0 0 24 24" fill="none" stroke-width="2"><polyline points="6 9 12 15 18 9"></polyline></svg></div><div class="tree-cat-body">`;
    cat.subs.forEach(sub => {
      const subManuals = catManuals.filter(m => m.sub === sub);
      if(subManuals.length === 0) return;
      html += `<div class="tree-sub" data-key="sub:${key}:${escapeHTML(sub)}" onclick="toggleTree(this, event)"><div class="tree-sub-head"><span>${escapeHTML(sub)} <span style="font-size:11px;color:var(--muted);">(${subManuals.length})</span></span><svg viewBox="0 0 24 24" fill="none" stroke-width="2"><polyline points="6 9 12 15 18 9"></polyline></svg></div><div class="tree-sub-body">`;
      subManuals.forEach(m => { html += `<div class="manual-item" onclick="openManual('${safeId(m.id)}')"><div class="manual-item-icon">${FILE_ICON}</div><div class="manual-item-title">${escapeHTML(m.title)}</div></div>`; });
      html += `</div></div>`;
    });
    html += `</div></div>`;
  });
  if (!html) html = `<div style="padding:20px;text-align:center;color:var(--muted);font-size:13px;">マニュアルはまだありません。</div>`;
  return html;
}

function handleSearch(keyword) {
  const container = document.getElementById("explore-content");
  if (!container) return;
  if (!keyword.trim()) {
    // 再描画しても開いていたカテゴリは開いたままにする
    const openKeys = new Set([...container.querySelectorAll('.tree-cat.open, .tree-sub.open')].map(el => el.dataset.key));
    container.innerHTML = generateTreeHtml(manuals);
    container.querySelectorAll('[data-key]').forEach(el => { if (openKeys.has(el.dataset.key)) el.classList.add('open'); });
    return;
  }
  const kw = keyword.toLowerCase();
  
  const hits = manuals.filter(m => {
    return (m.title && m.title.toLowerCase().includes(kw)) || 
           (m.sub && m.sub.toLowerCase().includes(kw)) || 
           m.steps.some(s => (s.text && s.text.toLowerCase().includes(kw)) || (s.title && s.title.toLowerCase().includes(kw)) || (s.items && s.items.some(it => it && it.toLowerCase().includes(kw))) || (s.ojt && s.ojt.toLowerCase().includes(kw)));
  });

  if (hits.length === 0) { container.innerHTML = `<div style="padding:20px;text-align:center;color:var(--muted);font-size:13px;">見つかりませんでした。</div>`; return; }
  let html = `<div style="font-size:12px;font-weight:800;color:var(--ember);margin-bottom:12px;">検索結果: ${hits.length}件</div>`;
  hits.forEach(m => { html += `<div class="manual-item" onclick="openManual('${safeId(m.id)}')"><div class="manual-item-icon">${FILE_ICON}</div><div class="manual-item-title">${escapeHTML(m.title)} <span class="manual-item-sub">(${escapeHTML(m.sub)})</span></div></div>`; });
  container.innerHTML = html;
}

  if (!currentManualId) return;
  if (bookmarkedIds.includes(currentManualId)) { bookmarkedIds = bookmarkedIds.filter(id => id !== currentManualId); }

  localStorage.setItem('gm_bookmarks', JSON.stringify(bookmarkedIds));
  document.getElementById("btn-bookmark").classList.toggle("active", bookmarkedIds.includes(currentManualId));
  if (document.querySelector('.nav-item.active span').textContent === 'マイ学習') renderBookmark();

function openManual(id) {
  const m = manuals.find(x => x.id === id);
  if (!m) {
    alert("このマニュアルは既に削除されています。");
    viewHistory = viewHistory.filter(v => v !== id); bookmarkedIds = bookmarkedIds.filter(v => v !== id);
    localStorage.setItem('gm_history', JSON.stringify(viewHistory)); localStorage.setItem('gm_bookmarks', JSON.stringify(bookmarkedIds));
    refreshCurrentView(); return;
  }
  currentManualId = id; addToHistory(id); 
  document.getElementById("btn-bookmark").classList.toggle("active", bookmarkedIds.includes(id));
  
  const updated = m.updatedAt ? `<div class="v-updated">最終更新 ${formatDate(m.updatedAt)}</div>` : "";
  let html = `<div class="v-title-area"><div style="font-size:11.5px;font-weight:800;color:var(--muted);margin-bottom:8px;">${HIERARCHY[m.category].label} ＞ ${escapeHTML(m.sub)}</div><h2 style="margin:0;font-size:18px;font-weight:800;color:var(--ink);">${escapeHTML(m.title)}</h2>${updated}</div>`;
  
  m.steps.forEach((s, idx) => {
    let contentHtml = "";
    let stepNumberHtml = `<span class="step-num">${idx + 1}.</span>`;
    
    if (s.type === "text") { contentHtml = `<div class="step-header">${stepNumberHtml}<span class="step-desc">${escapeHTML(s.text)}</span></div>`; }
    else if (s.type === "checklist") {
      contentHtml = `<div class="step-header" style="margin-bottom:8px;">${stepNumberHtml}<span class="step-desc" style="color:var(--muted);">チェックリスト</span></div>`;
      (s.items || []).forEach((it, i) => { contentHtml += `<div class="check-item"><input type="checkbox" id="chk-${idx}-${i}"><label for="chk-${idx}-${i}">${escapeHTML(it)}</label></div>`; });
    }
    else if (s.type === "accordion") { contentHtml = `<details class="manual-accordion"><summary>${escapeHTML(s.title) || "さらに詳しく見る"}</summary><div class="accordion-content">${escapeHTML(s.text)}</div></details>`; }
    else if (s.type === "media") {
      contentHtml = `<div class="step-header" style="flex-direction:column; align-items:stretch;"><div style="display:flex; gap:8px;">${stepNumberHtml}<span class="step-desc" style="color:var(--muted);">画像・動画</span></div>${mediaHtml(s)}${isImageStep(s) ? '<div class="zoom-caption">タップで拡大</div>' : ''}</div>`;
    }
    html += `<div class="step-card">${contentHtml}${s.ojt ? `<div class="ojt-tip">💡 <b>指導のポイント</b><br>${escapeHTML(s.ojt)}</div>` : ''}</div>`;
  });
  const vc = document.getElementById("viewer-content");
  vc.innerHTML = html;
  loadMediaImages(vc);
  viewer.classList.add("open");
}

function closeManual() { closeLightbox(); viewer.classList.remove("open"); currentManualId = null; if(document.querySelector('.nav-item.active span').textContent === 'ホーム') { renderHome(); } }

/* ============================== エディタ ============================== */
function updateSubCats() {
  const cat = document.getElementById("edit-cat").value;
  document.getElementById("edit-sub").innerHTML = HIERARCHY[cat].subs.map(s => `<option value="${s}">${s}</option>`).join("");
}
function editorStateNow() {
  return JSON.stringify({
    t: document.getElementById("edit-title").value,
    c: document.getElementById("edit-cat").value,
    s: document.getElementById("edit-sub").value,
    steps: editSteps
  });
}
function openEditor(id = null) {
  editingId = id;
  document.getElementById("editor-title").innerText = id ? "マニュアル編集" : "新規作成";
  const m = id ? manuals.find(x => x.id === id) : null;
  if (m) {
    document.getElementById("edit-title").value = m.title; document.getElementById("edit-cat").value = m.category;
    updateSubCats(); document.getElementById("edit-sub").value = m.sub;
    editSteps = JSON.parse(JSON.stringify(m.steps));
  } else {
    editingId = null;
    document.getElementById("edit-title").value = ""; document.getElementById("edit-cat").value = "hall";
    updateSubCats(); editSteps = [{ type: "text", text: "", ojt: "" }];
  }
  renderEditorSteps();
  editorSnapshot = editorStateNow();
  editor.classList.add("open");
}
// force=true は保存後など、確認なしで閉じるとき
function closeEditor(force = false) {
  if (!force) {
    if (document.activeElement) document.activeElement.blur(); // 入力中の内容を反映させてから比較
    const dirty = isUploading || editorStateNow() !== editorSnapshot;
    if (dirty && !confirm("保存していない変更があります。破棄して閉じますか？")) return;
  }
  editor.classList.remove("open");
  editingId = null;
}

function updateCheckItem(idx, itemIdx, val) { editSteps[idx].items[itemIdx] = val; }
function addCheckItem(idx) { editSteps[idx].items.push(""); renderEditorSteps(); }
function removeCheckItem(idx, itemIdx) { editSteps[idx].items.splice(itemIdx, 1); renderEditorSteps(); }

function addStepField(type) {
  if(type === 'text') editSteps.push({ type: "text", text: "", ojt: "" });
  if(type === 'checklist') editSteps.push({ type: "checklist", items: [""], ojt: "" });
  if(type === 'accordion') editSteps.push({ type: "accordion", title: "", text: "", ojt: "" });
  if(type === 'media') editSteps.push({ type: "media", url: "", mediaKey: "", mediaType: "", ojt: "" });
  renderEditorSteps();
  const c = document.getElementById("manual-editor").querySelector(".v-content");
  setTimeout(()=> c.scrollTop = c.scrollHeight, 100);
}
function removeStep(idx) { editSteps.splice(idx, 1); renderEditorSteps(); }
function moveStep(idx, dir) {
  const j = idx + dir;
  if (j < 0 || j >= editSteps.length) return;
  [editSteps[idx], editSteps[j]] = [editSteps[j], editSteps[idx]];
  renderEditorSteps();
}

function renderEditorSteps() {
  const container = document.getElementById("editor-steps-container");
  container.innerHTML = editSteps.map((step, idx) => {
    let inputSection = "";
    
    if (step.type === "text") { 
      inputSection = `<label class="form-label">手順のテキスト</label><textarea class="form-textarea" placeholder="手順を記入" onchange="editSteps[${idx}].text = this.value">${escapeHTML(step.text) || ""}</textarea>`; 
    } 
    else if (step.type === "checklist") {
      inputSection = `<label class="form-label">チェックリストの項目</label>`;
      (step.items || []).forEach((it, i) => { inputSection += `<div style="display:flex;gap:8px;margin-bottom:8px;"><input type="text" class="form-input" style="margin:0;" placeholder="項目を入力" value="${escapeHTML(it)}" onchange="updateCheckItem(${idx}, ${i}, this.value)"><button style="padding:0;width:32px;border:none;background:#FEE2E2;color:#DC2626;border-radius:6px;cursor:pointer;" onclick="removeCheckItem(${idx}, ${i})">✕</button></div>`; });
      inputSection += `<button class="btn-add-step" style="width:100%; margin:4px 0 12px; padding:8px;" onclick="addCheckItem(${idx})">＋ 項目を追加</button>`;
    }
    else if (step.type === "accordion") { 
      inputSection = `<label class="form-label">折りたたみのタイトル</label><input type="text" class="form-input" placeholder="例: ※イレギュラー時の対応" value="${escapeHTML(step.title) || ""}" onchange="editSteps[${idx}].title = this.value"><label class="form-label">詳細テキスト</label><textarea class="form-textarea" placeholder="詳細を記入" onchange="editSteps[${idx}].text = this.value">${escapeHTML(step.text) || ""}</textarea>`; 
    }
    else if (step.type === "media") {
      inputSection = `<label class="form-label">画像 (ファイルを選択)</label>
        <input type="file" accept="image/*" class="form-file" onchange="handleMediaUpload(this, ${idx})">
        <label class="form-label">動画はYouTubeのURL (または画像のURL)</label>
        <input type="text" class="form-input" placeholder="https://youtu.be/..." value="${escapeHTML(step.url) || ""}" onchange="setMediaUrl(${idx}, this.value)">
        <div class="media-hint">動画はYouTubeに「限定公開」でアップしてURLを貼ってください。</div>
        ${mediaHtml(step)}`;
    }

    const tools = `<div class="step-tools">
        <button class="step-tool-btn" onclick="moveStep(${idx}, -1)" ${idx === 0 ? "disabled" : ""} aria-label="上へ移動">↑</button>
        <button class="step-tool-btn" onclick="moveStep(${idx}, 1)" ${idx === editSteps.length - 1 ? "disabled" : ""} aria-label="下へ移動">↓</button>
        <div class="step-remove-btn" onclick="removeStep(${idx})">削除 ✕</div>
      </div>`;

    return `<div class="edit-step-card">${tools}<div style="font-size:12px; font-weight:800; color:var(--ember); margin-bottom:12px;">ブロック ${idx + 1}</div>${inputSection}<label class="form-label" style="margin-top:8px;">💡 指導のポイント (OJTメモ / 任意)</label><textarea class="form-textarea" style="min-height:50px; background:rgba(193,83,27,0.1); margin-bottom:0; border-color:var(--ember);" placeholder="新人がつまずきやすいポイントなど" onchange="editSteps[${idx}].ojt = this.value">${escapeHTML(step.ojt) || ""}</textarea></div>`;
  }).join("");
  loadMediaImages(container);
}

function saveManual() {
  if (isUploading) { alert("現在、画像を送信中です。完了するまでお待ちください。"); return; }
  if (document.activeElement) document.activeElement.blur(); // 入力中の内容を確実に反映
  const title = document.getElementById("edit-title").value.trim();
  const cat = document.getElementById("edit-cat").value;
  const sub = document.getElementById("edit-sub").value;
  if (!title) { alert("タイトルを入力してください"); return; }
  
  const validSteps = editSteps.filter(s => {
    if(s.type === 'text') return (s.text || "").trim() !== "";
    if(s.type === 'checklist') return (s.items || []).some(i => i.trim() !== "");
    if(s.type === 'accordion') return (s.title || "").trim() !== "" || (s.text || "").trim() !== "";
    if(s.type === 'media') return (s.url || "").trim() !== "" || !!s.mediaKey;
    return false;
  });
  if (validSteps.length === 0) { alert("有効なブロックがありません"); return; }

  const now = Date.now();
  const onError = e => alert("保存に失敗しました: " + e.message);

  if (editingId) {
    const id = editingId;
    const old = manuals.find(x => x.id === id);
    const data = { ...(old || {}), id, category: cat, sub: sub, title: title, steps: validSteps, createdAt: (old && old.createdAt) ?? now, updatedAt: now };
    manualsRef.child(id).set(data).then(() => {
      // 編集で使われなくなった画像をDBから削除
      const newKeys = new Set(collectMediaKeys(data));
      collectMediaKeys(old).filter(k => !newKeys.has(k)).forEach(k => mediaRef.child(k).remove());
      closeEditor(true);
      openManual(id);
    }).catch(onError);
  } else {
    const id = manualsRef.push().key;
    const data = { id, category: cat, sub: sub, title: title, steps: validSteps, createdAt: now, updatedAt: now };
    manualsRef.child(id).set(data).then(() => closeEditor(true)).catch(onError);
  }
}

function deleteManual(id) {
  if (!confirm("本当にこのマニュアルを削除しますか？")) return;
  const target = manuals.find(m => m.id === id);
  manualsRef.child(id).remove().then(() => {
    collectMediaKeys(target).forEach(k => mediaRef.child(k).remove());
    viewHistory = viewHistory.filter(v => v !== id); bookmarkedIds = bookmarkedIds.filter(v => v !== id);
    localStorage.setItem('gm_history', JSON.stringify(viewHistory)); localStorage.setItem('gm_bookmarks', JSON.stringify(bookmarkedIds));
    closeManual();
  }).catch(e => alert("削除に失敗しました: " + e.message));
}
</script>
